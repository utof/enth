  { path = "f64::exp_m1", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::ln", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
