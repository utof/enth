  { path = "f32::cosh", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::tanh", reason = "use `libm::tanh`/`tanhf` or the `tanh_approx` in enth_dsp::util::math" },
  { path = "f32::asinh", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::acosh", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::atanh", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::exp", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::exp2", reason = "LLVM rewrites powf(2, x) into exp2, so it is not portable either: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::exp_m1", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::ln", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::ln_1p", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
