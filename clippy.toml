  { path = "f32::sin_cos", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::asin", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::acos", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::atan", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
