  # --- Real time (docs/architecture.md, rule 3): no channels in core crates ---
  # std's mpsc allocates a block as senders outrun the receiver and blocks in recv; sync_channel blocks in send. Use
  # an `rtrb` ring. Core crates spawn no threads, so they have no use for channels; shells opt out at the crate root.
  { path = "std::sync::mpsc::channel", reason = "unbounded: it allocates on send and has no overflow policy; use an `rtrb` ring (enth-engine rule)" },
  { path = "std::sync::mpsc::sync_channel", reason = "blocks in send and allocates; use an `rtrb` ring with an overflow policy" },
  { path = "crossbeam_channel::unbounded", reason = "unbounded: it allocates on send; use an `rtrb` ring" },
  { path = "crossbeam::channel::unbounded", reason = "unbounded: it allocates on send; use an `rtrb` ring" },
  { path = "flume::unbounded", reason = "unbounded: it allocates on send; use an `rtrb` ring" },
