[package]
name = "spike_np_rename"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
nice-plug = { version = "=0.4.2", default-features = false, features = ["vst3", "assert_process_allocs", "tracing-subscriber"] }

[workspace]

[patch.crates-io]
nice-plug = { path = "../../../nice-plug/crates/nice-plug" }
nice-plug-core = { path = "../../../nice-plug/crates/nice-plug-core" }
nice-plug-egui = { path = "../../../nice-plug/crates/nice-plug-egui" }
baseview = { path = "../../../baseview" }
egui-baseview = { path = "../../../egui-baseview" }
