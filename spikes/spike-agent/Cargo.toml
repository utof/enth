[package]
name = "spike-agent"
description = "Phase 0 lane P: agent-loop probe. A CLI over the spike-metric toy synth (patch file, descriptors, check with measured hints, step) for testing whether an LLM agent can reach text goals"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "spike_agent"

[[bin]]
name = "spike-agent"
path = "src/main.rs"

[dependencies]
# The toy synth, WAV codec, loudness (`Analyzer::loudness`, EBU R128) and YIN pitch tracker all come from the metric spike.
spike-metric = { path = "../spike-metric" }
# Same versions as spike-metric (already in Cargo.lock): the descriptors do their own STFT.
realfft = "3.5.0"
serde_json.workspace = true
clap = { version = "4.6.5", features = ["derive"] }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[lints]
workspace = true
