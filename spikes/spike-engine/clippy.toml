# Lint options for spike-engine. This file replaces (does not extend) the repo-root clippy.toml for this
# crate, so it carries the bit-exact rules from docs/spikes/engine.md instead of the core-crate I/O bans.
# The rules: transcendentals only through the pinned `libm` crate (see src/math.rs), no fused multiply-add,
# no algebraic_* (reassociation allowed), fixed summation order.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
disallowed-methods = [
  { path = "f32::sin", reason = "std maths differs between libm, glibc, musl and wasm; use crate::math (libm)" },
  { path = "f32::cos", reason = "use crate::math (libm)" },
  { path = "f32::tan", reason = "use crate::math (libm)" },
  { path = "f32::sin_cos", reason = "use crate::math (libm)" },
  { path = "f32::asin", reason = "use crate::math (libm)" },
  { path = "f32::acos", reason = "use crate::math (libm)" },
  { path = "f32::atan", reason = "use crate::math (libm)" },
  { path = "f32::atan2", reason = "use crate::math (libm)" },
  { path = "f32::sinh", reason = "use crate::math (libm)" },
  { path = "f32::cosh", reason = "use crate::math (libm)" },
  { path = "f32::tanh", reason = "use crate::math::tanh_approx or libm" },
  { path = "f32::exp", reason = "use crate::math (libm)" },
  { path = "f32::exp2", reason = "LLVM rewrites powf(2, x) into exp2: also not portable; use crate::math (libm)" },
  { path = "f32::exp_m1", reason = "use libm" },
  { path = "f32::ln", reason = "use crate::math (libm)" },
  { path = "f32::ln_1p", reason = "use libm" },
  { path = "f32::log", reason = "use libm" },
  { path = "f32::log2", reason = "use crate::math (libm)" },
  { path = "f32::log10", reason = "use crate::math (libm)" },
  { path = "f32::powf", reason = "use libm::powf (slow: avoid in hot code)" },
  { path = "f32::powi", reason = "compiler-rt __powisf2 and LLVM expansion are not specified; multiply explicitly" },
  { path = "f32::cbrt", reason = "use libm" },
  { path = "f32::hypot", reason = "use libm" },
  { path = "f32::mul_add", reason = "fused only where the target has FMA (or via libm software fmaf): hashes would differ" },
  { path = "f32::algebraic_add", reason = "allows reassociation and contraction" },
  { path = "f32::algebraic_sub", reason = "allows reassociation and contraction" },
  { path = "f32::algebraic_mul", reason = "allows reassociation and contraction" },
  { path = "f32::algebraic_div", reason = "allows reassociation and contraction" },
  { path = "f32::algebraic_rem", reason = "allows reassociation and contraction" },
  { path = "f64::sin", reason = "use libm" },
  { path = "f64::cos", reason = "use libm" },
  { path = "f64::tan", reason = "use libm" },
  { path = "f64::exp", reason = "use libm" },
  { path = "f64::exp2", reason = "use libm" },
  { path = "f64::ln", reason = "use libm" },
  { path = "f64::log2", reason = "use libm" },
  { path = "f64::log10", reason = "use libm" },
  { path = "f64::powf", reason = "use libm" },
  { path = "f64::powi", reason = "multiply explicitly" },
  { path = "f64::tanh", reason = "use libm" },
  { path = "f64::mul_add", reason = "fused only where the target has FMA" },
  { path = "wide::f32x4::mul_add", reason = "fused on x86 with FMA and on aarch64, unfused elsewhere: hashes differ with -C target-cpu=native" },
  { path = "wide::f32x4::mul_sub", reason = "same as mul_add" },
  { path = "wide::f32x4::mul_neg_add", reason = "same as mul_add" },
  { path = "wide::f32x4::mul_neg_sub", reason = "same as mul_add" },
  { path = "wide::f32x8::mul_add", reason = "same as f32x4::mul_add" },
  { path = "wide::f32x8::mul_sub", reason = "same as mul_add" },
  { path = "wide::f32x8::mul_neg_add", reason = "same as mul_add" },
  { path = "wide::f32x8::mul_neg_sub", reason = "same as mul_add" },
]
disallowed-types = [
  { path = "std::sync::Mutex", reason = "no locks in engine code (RTSan does not see an uncontended std lock)" },
  { path = "std::sync::RwLock", reason = "no locks in engine code" },
  { path = "std::collections::HashMap", reason = "RandomState iteration order changes per process" },
  { path = "std::collections::HashSet", reason = "RandomState iteration order changes per process" },
]
