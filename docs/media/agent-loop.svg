<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" width="760" height="408" role="img" aria-label="The LLM decides, the engine measures, the optimiser fine-tunes" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>The LLM decides, the engine measures, the optimiser fine-tunes</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="407" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="36" font-size="16" font-weight="600" fill="#1f2328">The LLM decides, the engine measures, the optimiser fine-tunes</text>
<rect x="24" y="96" width="124" height="72" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="38" y="118" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Goal</text>
<text x="38" y="136" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">text, reference</text>
<text x="38" y="152" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">or edit request</text>
<path d="M148 132H176" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<rect x="176" y="80" width="200" height="104" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="190" y="102" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">LLM agent</text>
<text x="190" y="120" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">picks modules and routing</text>
<text x="190" y="136" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">sets values in real units</text>
<text x="190" y="152" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">writes expectations</text>
<text x="190" y="168" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">explains the result</text>
<rect x="496" y="80" width="240" height="104" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="510" y="102" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Engine via the enth CLI</text>
<text x="510" y="120" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">step: apply → render → describe</text>
<text x="510" y="136" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">check expectations / compare</text>
<text x="510" y="152" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">measured hints from real renders</text>
<text x="510" y="168" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">deterministic, compact JSON</text>
<path d="M376 112H496" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="436" y="104" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="middle">ops</text>
<path d="M496 152H376" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<text x="436" y="172" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="middle">feedback JSON</text>
<rect x="336" y="256" width="200" height="88" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="350" y="278" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Optimiser · enth match</text>
<text x="350" y="296" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">CMA-ES on freed params only</text>
<text x="350" y="312" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">needs a reference sound</text>
<text x="350" y="328" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">structure stays the agent's</text>
<path d="M276 184V300H336" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="268" y="232" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="end">frees params,</text>
<text x="268" y="248" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="end">gets tuned patch</text>
<path d="M536 300H616V184" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="624" y="232" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">hundreds of</text>
<text x="624" y="248" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">short renders</text>
<text x="24" y="384" font-size="12" font-weight="400" fill="#57606a" text-anchor="start">Stops when every expectation passes, the score reaches the goal, or the render budget runs out.</text>
</svg>
