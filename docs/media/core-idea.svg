<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" width="760" height="416" role="img" aria-label="Five features share one Challenge and four engine functions" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Five features share one Challenge and four engine functions</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs>
<rect x="0.5" y="0.5" width="759" height="415" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="36" font-size="16" font-weight="600" fill="#1f2328">Five features share one Challenge and four engine functions</text>
<rect x="24" y="64" width="208" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="38" y="86" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Recreate round</text>
<text x="38" y="104" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">random target, your difficulty</text>
<path d="M232 92.0H264" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<rect x="24" y="132" width="208" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="38" y="154" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Lesson step</text>
<text x="38" y="172" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">few knobs exposed</text>
<path d="M232 160.0H264" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<rect x="24" y="200" width="208" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="38" y="222" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Daily / duel</text>
<text x="38" y="240" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">same challenge, many players</text>
<path d="M232 228.0H264" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<rect x="24" y="268" width="208" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="38" y="290" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Create from sound</text>
<text x="38" y="308" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">target = your own sample</text>
<path d="M232 296.0H264" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<rect x="24" y="336" width="208" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="38" y="358" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Agent loop</text>
<text x="38" y="376" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">target = text expectations</text>
<path d="M232 364.0H264" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<path d="M264 92.0V364.0" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<path d="M264 228H296" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<rect x="296" y="160" width="184" height="136" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<text x="388" y="186" font-size="15" font-weight="600" fill="#1f2328" text-anchor="middle">Challenge</text>
<text x="312" y="210" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">target</text>
<text x="312" y="227" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">performance (notes)</text>
<text x="312" y="244" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">start patch</text>
<text x="312" y="261" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">constraints</text>
<text x="312" y="278" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">scoring spec</text>
<path d="M480 228H512" fill="none" stroke="#8c959f" stroke-width="1.25" marker-end="url(#arrow)"/>
<rect x="512" y="64" width="224" height="328" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25"/>
<text x="528" y="88" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">Rust core · deterministic</text>
<rect x="528" y="104" width="192" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="542" y="126" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">render()</text>
<text x="542" y="144" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">patch + notes → audio</text>
<rect x="528" y="174" width="192" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="542" y="196" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">analyse()</text>
<text x="542" y="214" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">audio → descriptors</text>
<rect x="528" y="244" width="192" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="542" y="266" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">score()</text>
<text x="542" y="284" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">audio vs target → 0–100</text>
<rect x="528" y="314" width="192" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
<text x="542" y="336" font-size="13.5" font-weight="600" fill="#1f2328" text-anchor="start">solve()</text>
<text x="542" y="354" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="start">target → candidate patches</text>
</svg>
