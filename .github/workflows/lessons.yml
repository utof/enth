name: lessons

# R2 Learn: every lesson stays honest (docs/learn.md, "`lesson-check` and the authoring loop"; lane LCK). `ci.yml`
# ignores `**/*.md`, so a lesson's text would run nothing there; and a lesson's verdict is a render, so a change to the
# DSP, the engine, the patch model, the challenge's scorers, the analysis, the session or the solver can break a lesson
# that nobody touched. This workflow runs on all of those.
#
# `cargo xtask lesson-check --cross --solve` (tools/lesson, `enth-lesson-tool`): the files of every pack in
# content/lessons/ (layout, schemas, sizes and hashes, patch bytes, the bundled pins, licences, the markdown lint), the
# playthrough of every step through a headless session (each check fails at its start and passes after its witness,
# sound margins of at least 1e-3), `--cross` (no check passes a neighbour's witness) and `--solve` (the hint follower,
# `closest` on every round, the audibility gate on every ear question). It fails on any failure. Under 10 minutes: the
# lessons run four at a time (the runner's cores), about 100 s for the 17 lessons on main (2026-10-21, local); the build
# is the rest, and the cache keeps it warm.
#
# `cargo xtask lesson-coverage` (GR2's mechanical half) fails until the curriculum covers every P1 module (C2 and C3
# are still to come), so it runs as a report and does not fail the job yet: make it blocking at GR2.

on:
  push:
    branches: [main]
    paths:  # what can change a lesson's verdict; the same list as pull_request
      - "content/lessons/**"
      - "tools/lesson/**"
      - "xtask/**"
      - "crates/enth-learn/**"
      - "crates/enth-session/**"
      - "crates/enth-solver/**"
      - "crates/enth-challenge/**"
      - "crates/enth-analysis/**"
      - "crates/enth-render/**"
      - "crates/enth-engine/**"
      - "crates/enth-patch/**"
      - "crates/enth-params/**"
      - "crates/enth-dsp/**"
      - "crates/enth-plugin/packs/**"  # the bundled archives `pack` compares with the content
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - ".github/workflows/lessons.yml"
  pull_request:
    paths:
      - "content/lessons/**"
      - "tools/lesson/**"
      - "xtask/**"
      - "crates/enth-learn/**"
      - "crates/enth-session/**"
      - "crates/enth-solver/**"
      - "crates/enth-challenge/**"
      - "crates/enth-analysis/**"
      - "crates/enth-render/**"
      - "crates/enth-engine/**"
      - "crates/enth-patch/**"
      - "crates/enth-params/**"
      - "crates/enth-dsp/**"
      - "crates/enth-plugin/packs/**"  # the bundled archives `pack` compares with the content
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - ".github/workflows/lessons.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny
  RUST_BACKTRACE: "1"

jobs:
  lesson-check:
    name: lesson-check --cross --solve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the lesson tool (release, as the xtask drivers run it)
        run: cargo build --locked --release --package enth-lesson-tool
      - name: Check every lesson (files, playthrough, --cross)
        run: cargo xtask lesson-check --cross
      - name: Solvability (--solve; the hint follower, closest, audibility)
        run: cargo xtask lesson-check --cross --solve
      - name: Coverage of the P1 modules (a report until GR2)
        continue-on-error: true
        run: cargo xtask lesson-coverage
      - name: The packs build reproducibly and match their pins
        run: cargo xtask pack --check
