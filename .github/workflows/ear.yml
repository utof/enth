name: ear

# R4 Ear-training games (docs/ear.md, "GR4" and "`ear-check` as built"; lane ECK). `ci.yml` ignores `**/*.md`, but the
# ear games are code and data, and their fairness is a render: a change to the music crate, the ear files of the
# challenge crate, the drill player, the lesson tool or anything a sound is made of (the DSP, the engine, the analysis
# and render crates, the patch model and the catalogue) can make a game unfair, unsolvable or non-deterministic with
# nobody touching the game. This workflow runs `cargo xtask ear-check` whenever any of them changes.
#
# `cargo xtask ear-check` (tools/lesson/src/ear/, `enth-lesson-tool`) is GR4's mechanical half: the music generator and
# every game's items regenerate their golden digests; per (game, level) the key oracle through the real judge, random
# and deaf players at chance, bias bots at chance +-3 % over 10,000 items; the closest pair of options of a measured
# sample under `sound/1` (2 JND, 6 at level 1; what `sound/1` cannot hear is listed as not measured); an ideal observer
# at 95 % or more at the top level; the F1e judge's staircase criteria over each game's measured ladder; coverage. It
# fails the job on a leak, a drifting hash or a broken item always, and on a ladder criterion (audibility, solvability,
# staircase, coverage) for a game that has two levels or more (a one-level stub reports them); `--strict` would fail on
# them for every game. Under 10 minutes (lane ECK's timing is in docs/ear.md); the build is the rest, and the cache
# keeps it warm.

on:
  push:
    branches: [main]
    paths:  # the same paths as pull_request: only what can change an ear game runs it
      - "crates/enth-music/**"
      - "crates/enth-challenge/**"
      - "crates/enth-learn/**"
      - "crates/enth-analysis/**"
      - "crates/enth-render/**"
      - "crates/enth-engine/**"
      - "crates/enth-patch/**"
      - "crates/enth-params/**"
      - "crates/enth-dsp/**"
      - "tools/lesson/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - ".github/workflows/ear.yml"
  pull_request:
    paths:
      - "crates/enth-music/**"
      - "crates/enth-challenge/**"
      - "crates/enth-learn/**"
      - "crates/enth-analysis/**"
      - "crates/enth-render/**"
      - "crates/enth-engine/**"
      - "crates/enth-patch/**"
      - "crates/enth-params/**"
      - "crates/enth-dsp/**"
      - "tools/lesson/**"
      - "xtask/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/config.toml"
      - ".github/workflows/ear.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny
  RUST_BACKTRACE: "1"

jobs:
  ear-check:
    name: ear-check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the tool (release: the simulations render and run millions of draws)
        run: cargo build --release --locked -p enth-lesson-tool
      - name: Check every ear game
        timeout-minutes: 10
        run: cargo xtask ear-check
