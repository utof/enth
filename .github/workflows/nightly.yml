name: nightly

# Slow checks that stay off the critical path (P1a lane S0; research report 04). Scheduled runs use the default branch.
#   rtsan:    the engine's real-time tests under the Rust nightly RealtimeSanitizer. It complements assert_no_alloc by
#             also catching syscalls, I/O and pthread locks inside `process`. It does not see an uncontended std Mutex
#             (measured in Phase 0), so the clippy ban on Mutex/RwLock stays.
#   proptest: every property test with a fresh random seed and ten times the cases. The gate itself runs with a fixed
#             seed (.cargo/config.toml, .config/nextest.toml); a find here is replayed with the printed seed. A property
#             that renders per case caps its own count (enth-challenge's P10 pair: 1,000, `render_property` in
#             tests/ss_sound.rs): proptest applies PROPTEST_CASES over any count a test configures, and at 10,000 the
#             pair hit nextest's ten-minute limit (run 39506542786).
#   leak:     the plugin's leak gates (P1b lane INT, `cargo xtask leak-test`): 200 editor open/close cycles under Xvfb
#             (at most 26 KB per cycle, threads constant, one editor_closed per open) and 200 instance lives (flat PSS,
#             no thread or descriptor left behind). Locally the coordinator runs them before merging an editor lane.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  rtsan:
    name: RealtimeSanitizer (nightly)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # The runtime (librustc-nightly_rt.rtsan.a) ships in the nightly rust-std for x86_64-unknown-linux-gnu: no downloads.
      - name: Install a nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.133
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: rtsan
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `--cfg enth_rtsan` switches on `#[sanitize(realtime = "nonblocking")]` on the engine's process functions (declared
      # in the workspace lints; the attribute lives in the engine lanes). --target keeps the flags off build scripts
      # and proc macros. A violation aborts the process, so nextest names the failing test.
      - name: Engine and render tests under RTSan
        env:
          RUSTFLAGS: -Zsanitizer=realtime --cfg enth_rtsan
        run: cargo +nightly nextest run --locked --target x86_64-unknown-linux-gnu --no-tests=pass -p enth-engine -p enth-render

  proptest:
    name: proptest exploration (random seed, 10,000 cases)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.133
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: proptest
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Pick a seed
        id: seed
        shell: bash
        run: |
          seed=$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "::notice title=proptest seed::PROPTEST_RNG_SEED=$seed PROPTEST_CASES=10000"
      # The core and session crates only: the spikes, the UI, the plugin and the test host have no properties and need system libraries.
      - name: Property tests, 10,000 cases each
        env:
          PROPTEST_RNG_SEED: ${{ steps.seed.outputs.seed }}
          PROPTEST_CASES: "10000"
        run: cargo nextest run --locked --profile explore --no-tests=pass --workspace --exclude 'spike-*' --exclude enth-ui --exclude enth-plugin --exclude enth-test-host --exclude xtask
      # A new regression file is the reproduction: commit it together with the fix (it is merged as a union). proptest
      # writes `<test file>.proptest-regressions` beside an integration test's file (tests/fuzz_lite.rs ->
      # tests/fuzz_lite.proptest-regressions), which the old `**/proptest-regressions/**` never matched: run 39506542786
      # uploaded nothing. The committed files come along; the new or grown one is the find.
      - name: Keep new regression files
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proptest-regressions-${{ steps.seed.outputs.seed }}
          path: |
            **/*.proptest-regressions
            **/proptest-regressions/**
          if-no-files-found: ignore

  leak:
    name: leak gates (editor-cycles and instance churn under Xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # The plugin's build libraries (as in ci.yml), plus Xvfb and Mesa's software OpenGL: the editor opens only on a
      # virtual display, never a GPU (`leak-test` starts xvfb-run itself and passes no display on).
      # libegl1 and libegl-mesa0 are not optional (lane NTF, FU1): the editor's baseview opens its GL context through
      # EGL, else through GLX with an sRGB framebuffer config, and Xvfb (21.1.12 with Mesa 25.2.8) offers sRGB GLX
      # configs only when it can load Mesa's EGL vendor itself. Nothing else here pulls the two in; without them every
      # `gui.create` fails, as in the first nightly (run 39506542786: no frame drawn in 200 cycles, no build counted).
      - name: System libraries for the plugin, Xvfb and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libasound2-dev libgl-dev libjack-jackd2-dev \
            libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev \
            libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 mesa-utils
      # What the editor will find under Xvfb, in the log: the EGL platform it tries first and the GLX fallback.
      - name: Software OpenGL under Xvfb
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" sh -c 'eglinfo -B -p x11; glxinfo -B' 2>&1 | head -60
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: leak
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask leak-test
      # The JSON reports and the test host's logs (the plugin bundle stays out: 16 MB).
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leak-test
          path: |
            target/leak-test/*.json*
            target/leak-test/*.log
          if-no-files-found: ignore
