name: ci

on:
  push:
    branches: [main]
    paths-ignore:  # docs-only changes run nothing (69 of the first 107 commits on main changed only Markdown)
      - "**/*.md"
      - "docs/**"
      - "_local/**"
  pull_request:
    paths-ignore:  # docs-only changes run nothing (69 of the first 107 commits on main changed only Markdown)
      - "**/*.md"
      - "docs/**"
      - "_local/**"
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"   # weekly, so new RustSec advisories surface without a push

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny   # cargo >= 1.97: warnings fail the build without invalidating the cache (unlike RUSTFLAGS=-Dwarnings)
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: fmt, clippy, test, layers, wasm
    runs-on: ubuntu-24.04      # pinned: the owner's Mint 22.3 is based on Ubuntu 24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version

      # ALSA/JACK/X11/GL for the plugin and the editor (same list as nice-plug's CI), plus Mesa's
      # lavapipe: enth-ui's snapshot tests render on a CPU Vulkan adapter only (.cargo/config.toml).
      - name: System libraries for plugin, GUI and audio crates
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libasound2-dev libgl-dev libjack-jackd2-dev \
            libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev \
            libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            mesa-vulkan-drivers

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}   # PRs read the cache, only main writes it

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo xtask check-layers
      - run: cargo xtask wasm-check

  # Cross-target guard (lane FB, research report 04 of the R1/S1 session): the plugin must keep compiling, and stay
  # clippy-clean, for the two platforms friends use. Nothing is linked or run: `clippy` stops after type checking, so
  # no mingw or Apple SDK is needed and a Linux runner is enough (measured locally: 38 s and 29 s cold, 3 jobs). The
  # real Windows (MSVC) and macOS builds are in release.yml, on a tag or by hand, because a macOS minute costs ten times
  # a Linux one. The libraries the Linux jobs install (ALSA, JACK, X11, GL) are not needed: those crates are
  # target-specific, and the run above also passed with `PKG_CONFIG=/bin/false`. Windows-gnu stands in for MSVC here
  # (both are `cfg(windows)`); the MSVC link is release.yml's job.
  cross-target:
    name: clippy for ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-gnu, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Add the standard library for ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cross-${{ matrix.target }}   # both legs share a job id; without a key they would overwrite each other's cache
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p enth-plugin -p xtask --all-targets --all-features --locked --target ${{ matrix.target }} -- -D warnings

  # R1/S1, pre-declared by lane S0r: the editor and the plugin with every editor feature on (`learn`, `recreate`,
  # `presets`, `add-module`). The `check` job builds default features only, so it never compiles the Presets and
  # Recreate hooks or the Recreate views (`add-module` is a default feature since lane AM). Lane AM's hook was the first
  # with content, so the job runs. R2 (lane S0l) adds the plugin's `learn` feature (src/learn.rs), which builds nothing
  # without it, to the clippy line; enth-ui's own `learn` tests (the Learn header hook) run in the test line.
  editor-features:
    name: editor features (lanes AM, PBU, RUI)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: System libraries for plugin, GUI and audio crates
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libasound2-dev libgl-dev libjack-jackd2-dev \
            libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev \
            libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: >-
          cargo clippy --locked -p enth-ui -p enth-plugin --all-targets
          --features enth-ui/learn,enth-ui/recreate,enth-ui/presets,enth-ui/add-module,enth-plugin/learn -- -D warnings
      - run: cargo test --locked -p enth-ui --features learn,recreate,presets,add-module

  deny:
    name: cargo-deny ${{ matrix.checks }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    # A newly published advisory should not turn every PR red; it shows as a failed (allowed) job.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check ${{ matrix.checks }}

  # clap-validator 0.4.1 has no GUI tests, so no display is needed (Phase 0 task 3, docs/spikes/shell.md; the shell and
  # UI spikes it validated then left the workspace in P1b lane INT).
  # `cargo xtask validate` downloads the pinned release (sha256-checked; the pin lives in xtask/src/validate.rs, the one
  # place) and runs it on the bundle. The debug bundle has nice-plug's assert_process_allocs on (the validator's
  # process() calls abort on any allocation).
  validate:
    name: clap-validator on the plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: System libraries for plugin, GUI and audio crates
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libasound2-dev libgl-dev libjack-jackd2-dev \
            libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev \
            libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Validate enth-plugin (debug and release bundles)
        run: |
          cargo xtask validate --package enth-plugin
          cargo xtask validate --package enth-plugin --release

  # Phase 0 lane H and P1b lanes TH, SK and PL (docs/spikes/test-host.md, docs/plugin.md). The plugin goes through a
  # real CLAP host (clack-host in tools/test-host): loaded from its .clap file, rendered offline with a fixed block size
  # and compared with the committed SHA-256 of the samples: the engine's goldens through the plugin, and plugin-only
  # cases. It opens no window, so no display is needed.
  host-render:
    name: plugin golden render (enth-plugin via the test host)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: System libraries for plugin, GUI and audio crates
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libasound2-dev libgl-dev libjack-jackd2-dev \
            libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev \
            libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Debug bundle: nice-plug's assert_process_allocs is on, so an allocation in process() aborts the render.
      # The release bundle gives the same hashes (checked locally with `--release`).
      - run: cargo xtask host-render --package enth-plugin
      - name: The same instances render the same samples (shared-state check)
        run: |
          target/debug/enth-test-host instances target/bundled/enth-plugin.clap \
            --state tools/test-host/golden/enth-plugin.patch.json \
            --notes "C4@0+1.5:0.8, E4@0+1.5:0.8, G4@0+1.5:0.8" -n 3
