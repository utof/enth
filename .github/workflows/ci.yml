name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"   # weekly, so new RustSec advisories surface without a push

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny   # cargo >= 1.97: warnings fail the build without invalidating the cache (unlike RUSTFLAGS=-Dwarnings)
  RUST_BACKTRACE: "1"

jobs:
  check:
    name: fmt, clippy, test, layers, wasm
    runs-on: ubuntu-24.04      # pinned: the owner's Mint 22.3 is based on Ubuntu 24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustc --version

      # ALSA/JACK/X11/GL for the plugin and UI spikes (same list as nice-plug's CI), plus Mesa's
      # lavapipe: enth-ui's snapshot tests render on a CPU Vulkan adapter only (.cargo/config.toml).
      - name: System libraries for plugin, GUI and audio crates
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libasound2-dev libgl-dev libjack-jackd2-dev \
            libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev \
            libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            mesa-vulkan-drivers

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}   # PRs read the cache, only main writes it

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo xtask check-layers
      - run: cargo xtask wasm-check

  deny:
    name: cargo-deny ${{ matrix.checks }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    # A newly published advisory should not turn every PR red; it shows as a failed (allowed) job.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check ${{ matrix.checks }}

  # Task 3 (docs/spikes/shell.md). clap-validator 0.4.1 has no GUI tests, so no display is needed.
  # `cargo xtask validate` downloads the pinned release (sha256-checked; the pin lives in xtask/src/validate.rs, the one
  # place) and runs it on the bundle. The debug bundle has nice-plug's assert_process_allocs on (the validator's
  # process() calls abort on any allocation).
  validate:
    name: clap-validator on the plugins
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: System libraries for plugin, GUI and audio crates
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libasound2-dev libgl-dev libjack-jackd2-dev \
            libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev \
            libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Validate spike-shell (debug and release bundles)
        run: |
          cargo xtask validate --package spike-shell
          cargo xtask validate --package spike-shell --release
      # Task 4: the reference panel in a copy of the shell plugin (spikes/spike-ui-plugin).
      - name: Validate spike-ui-plugin (debug and release bundles)
        run: |
          cargo xtask validate --package spike-ui-plugin
          cargo xtask validate --package spike-ui-plugin --release
      # P1b: the product plugin, from the day crates/enth-plugin exports a CLAP entry (lane SK). Until then the
      # package builds as an empty library and `bundle` would write nothing, so these steps are skipped.
      - name: Does crates/enth-plugin export a CLAP entry yet?
        id: product
        run: |
          if grep -rqsE '^[[:space:]]*nice_export_clap!\(' crates/enth-plugin/src; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "crates/enth-plugin exports no CLAP entry yet: skipping its validation"
          fi
      - name: Validate enth-plugin (debug and release bundles)
        if: steps.product.outputs.ready == 'true'
        run: |
          cargo xtask validate --package enth-plugin
          cargo xtask validate --package enth-plugin --release

  # Phase 0 lane H (docs/spikes/test-host.md). The spike plugin goes through a real CLAP host (clack-host in
  # tools/test-host): loaded from its .clap file, rendered offline with a fixed block size and compared with
  # the committed SHA-256 of the samples. It opens no window, so no display is needed.
  host-render:
    name: plugin golden render (spike-shell via the test host)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: System libraries for plugin, GUI and audio crates
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libasound2-dev libgl-dev libjack-jackd2-dev \
            libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev \
            libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Debug bundle: nice-plug's assert_process_allocs is on, so an allocation in process() aborts the render.
      # The release bundle gives the same six hashes (checked locally with `--release`).
      - run: cargo xtask host-render --package spike-shell
      - name: The same instances render the same samples (shared-state check)
        run: |
          target/debug/enth-test-host instances target/bundled/spike-shell.clap \
            --notes "C4@0+1.5:0.8, E4@0+1.5:0.8, G4@0+1.5:0.8" -n 3
      # P1b: the product plugin through the test host (engine goldens through the plugin, plugin-only cases), from the
      # day its golden file is committed (lanes TH and SK). The debug bundle has assert_process_allocs on.
      - name: Plugin golden render (enth-plugin via the test host)
        if: hashFiles('tools/test-host/golden/enth-plugin.toml') != ''
        run: cargo xtask host-render --package enth-plugin
