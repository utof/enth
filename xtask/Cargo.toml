[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true      # `validate` checks the downloaded clap-validator against its pinned SHA-256
# Pre-declared by lane S0r (R1/S1): `preset-add` loads a patch, sets its meta and writes `Patch::to_json()` (lane PR).
# Light (enth-params and serde): no engine, render or GUI crate in xtask.
enth-patch.workspace = true
# Pre-declared by lane S0l (R2): `lesson-check`, `lesson-coverage`, `lesson new`, `pack` and `lesson-gen` (lanes LCK and DEC)
# read the packs in their authoring layout (TOML), play every lesson's reference solution through a headless `Session`
# with jobs run inline, and reach the solver for `--solve`. xtask is tooling (exempt from the layer rules).
enth-learn = { workspace = true, features = ["toml"] }
enth-session.workspace = true
enth-solver.workspace = true
enth-challenge.workspace = true
# The bundler behind `cargo xtask bundle` (ISC). Exact pin, like the nice-plug it ships with.
nice-plug-xtask = "=0.1.1"
