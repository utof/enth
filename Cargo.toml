[workspace]
resolver = "3"
# Phase 0 spikes still in use: spike-metric (tools/listen depends on it), spike-engine (`cargo xtask wasm-hash`, the
# engine-golden workflow) and spike-agent (the agent-loop probe CLI). The shell and UI spikes (spike-shell, spike-ui,
# spike-ui-plugin) left the workspace in P1b lane INT once xtask targeted enth-plugin: their source stays under spikes/
# as the Phase 0 evidence the docs link to, frozen, and no longer builds (docs/architecture.md, "Folder topology").
members = ["crates/*", "xtask", "tests/golden", "spikes/spike-agent", "spikes/spike-engine", "spikes/spike-metric", "tools/*"]
default-members = ["crates/*", "xtask", "tests/golden"]   # plain `cargo build/test/clippy` skip spikes and tools; CI passes --workspace
# Vendored third-party crates (P1b lane FK, `[patch.crates-io]` below) are path dependencies inside the workspace
# directory, which cargo would otherwise adopt as members: clippy, fmt and `--workspace` would then lint them. The
# retired spikes are excluded so that no later glob adopts them again.
# `ml/` (R3b, Python, lane S0s) is not a Rust directory and never will be one: it is excluded by name, so that no glob and
# no stray Cargo.toml can ever put it in a cargo build (docs/phase-3.md, "ML rules").
exclude = ["vendor", "ml", "spikes/spike-shell", "spikes/spike-ui", "spikes/spike-ui-plugin"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# Internal crates: members write `enth-dsp.workspace = true`.
enth-dsp = { path = "crates/enth-dsp" }
enth-params = { path = "crates/enth-params" }
enth-patch = { path = "crates/enth-patch" }
enth-music = { path = "crates/enth-music" }          # L1 (R4 lane S0e)
enth-engine = { path = "crates/enth-engine" }
enth-render = { path = "crates/enth-render" }
enth-analysis = { path = "crates/enth-analysis" }
enth-challenge = { path = "crates/enth-challenge" }  # L4 (R1/S1 lane S0r)
enth-solver = { path = "crates/enth-solver" }
enth-learn = { path = "crates/enth-learn" }          # L5 (R2 lane S0l)
enth-cli = { path = "crates/enth-cli" }
enth-ui = { path = "crates/enth-ui" }
enth-session = { path = "crates/enth-session" }      # L6 (P1b lane S0b)
enth-plugin = { path = "crates/enth-plugin" }        # L8 (P1b lane S0b)
enth-golden = { path = "tests/golden" }       # tooling (exempt from layers): the golden-render harness behind `cargo xtask golden`
# Native UI (ADR-0002). Exact pins: egui must match the version nice-plug-egui is built against.
egui = { version = "=0.37.0", default-features = false }
egui_kittest = { version = "=0.37.0", default-features = false }
egui-wgpu = { version = "=0.37.0", default-features = false }

# P1a dependencies (lane S0, freeze point F0). Every one is pinned with `=`: a bump is a deliberate commit.
# After F0 only the coordinator edits this table and Cargo.lock, one commit per change. A lane that needs a crate
# asks for it, then writes `<crate>.workspace = true` in its own Cargo.toml. S0 already listed each crate in the
# Cargo.toml of the crate expected to use it, so Cargo.lock is resolved up front.
# Versions and licences read from the crates.io API on 2026-10-19; `cargo deny check bans licenses sources` passes.
#
# Numerics and data
libm = "=0.2.16"                                    # MIT. The only door to transcendentals in L0-L3: std maths differs per platform. A bump is an engine-version change.
serde = { version = "=1.0.229", features = ["derive"] }   # MIT OR Apache-2.0
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }   # MIT OR Apache-2.0. float_roundtrip: every finite f32/f64 survives text and back (patch files)
toml = "=1.1.8"                                     # MIT OR Apache-2.0. xtask, golden cases, eval goals
sha2 = "=0.11.1"                                    # MIT OR Apache-2.0. Pure-Rust SHA-256: patch hashes, golden hashes (no runtime CPU dispatch)
# Real time
rtrb = { version = "=0.4.0", default-features = false }   # MIT OR Apache-2.0. Wait-free SPSC ring buffer: plan and event rings. No `mpsc` or unbounded channels in the engine.
assert_no_alloc = "=1.1.2"                          # BSD-1-Clause (deny.toml allows it, ADR-0004). Debug-build tests only: release builds lack AllocDisabler.
# Analysis
rustfft = "=6.4.1"                                  # MIT OR Apache-2.0. Picks its code path by CPU: scores that gate pass/fail need a tolerance or a scalar path (design.md section 5)
realfft = "=3.5.0"                                  # MIT. Real-input wrapper for rustfft
ebur128 = "=0.1.10"                                 # MIT. EBU R128 loudness (LUFS, true peak)
# Tests and benchmarks (dev-dependencies only)
proptest = { version = "=1.12.0", default-features = false, features = ["std", "handle-panics"] }   # MIT OR Apache-2.0. No `fork`/`timeout` (nextest isolates tests per process); `handle-panics` keeps shrinking quiet. Gate seed: .cargo/config.toml, policy in .config/nextest.toml
insta = { version = "=1.49.0", features = ["json", "filters"] }                    # Apache-2.0. No `redactions`: it pulls pest → psm, a C-toolchain build step. In CI (CI=true) it acts like `--check`
insta-cmd = "=0.7.0"                                # Apache-2.0. CLI snapshots of stdout, stderr and exit code
gungraun = "=0.20.0"                                # Apache-2.0 OR MIT. Callgrind instruction budgets; needs valgrind and a gungraun-runner of the same version. Not for wasm.
# CLI (L8 only)
clap = { version = "=4.6.7", features = ["derive"] }   # MIT OR Apache-2.0
schemars = "=1.2.3"                                 # MIT. JSON Schema (draft 2020-12) for `enth schema`
strsim = "=0.11.1"                                  # MIT. did_you_mean for unknown parameters. (Deliberately no `jsonschema` crate: its default features build C code.)
hound = "=3.5.1"                                    # Apache-2.0. Reads external WAVs; L8 only: the CLI, and the plugin behind its `create` feature (our own float WAV writer is bytes-only, in enth-render)
rayon = "=1.12.0"                                   # MIT OR Apache-2.0. The CLI hands the solver a rayon-backed, index-ordered evaluator (P1a report 03); the plugin's `create` feature gives each create job its own pool. Never in L0-L5.

# P1b dependencies (lane S0b, freeze point F0b). Same rules as the P1a block above: every pin is exact, only the
# coordinator edits this table and Cargo.lock after F0b (one commit per change), and a lane that needs a crate asks for
# it, then writes `<crate>.workspace = true` in its own Cargo.toml. S0b already listed each crate in the Cargo.toml of
# the crate expected to use it, so Cargo.lock is resolved up front and a lane's `--locked` build cannot fail on a
# missing entry. All of these were already in Cargo.lock from the Phase 0 spikes; `cargo deny check` passes.
#
# Plugin shell (docs/adr/0001-plugin-shell.md). nice-plug breaks roughly monthly. Members add the features they need.
# `assert_process_allocs` only has an effect in debug builds (nice-plug gates it on debug_assertions).
nice-plug = { version = "=0.4.2", default-features = false }   # ISC. enth-plugin: features = ["vst3", "editor", "assert_process_allocs"]
nice-plug-egui = "=0.6.0"                           # ISC. Its default feature `opengl` renders the editor with glow (ADR-0002). Must match the egui pin
parking_lot = "=0.12.5"                             # MIT OR Apache-2.0. The one session Mutex shared by the host main thread and the GUI thread (never the audio thread)
# Editor dev window and its snapshot tests (enth-ui; the plugin depends on the library without the dev-window feature)
eframe = { version = "=0.37.0", default-features = false }   # MIT OR Apache-2.0. Dev window only. Members add features = ["glow", "x11", "clipboard"]; glow, not wgpu (ADR-0002)
# CLAP test host (tools/test-host). clack is pre-1.0 and changes its API between minor versions.
clack-host = "=0.2.0"                               # MIT OR Apache-2.0
clack-extensions = "=0.2.0"                         # MIT OR Apache-2.0. Members add the extension features they use
clack-plugin = "=0.2.0"                             # MIT OR Apache-2.0. dev-dependency of the test host: an in-process test plugin
x11rb = "=0.13.2"                                   # MIT OR Apache-2.0. Pure-Rust X11 client: the host-side parent window for embedded editors. baseview pulls the same version in
libc = "=0.2.191"                                   # MIT OR Apache-2.0. Test-host timing: clock_gettime, setrlimit(RLIMIT_RTTIME), sched_setaffinity (research 03)

# R1/S1 dependencies (lane S0r, freeze point F0r; research session 2026-10-20-r1-s1-recreate-and-instrument). Same rules
# as the blocks above: every pin is exact, only the coordinator edits this table and Cargo.lock after F0r (one commit
# per change), and a lane that needs a crate asks for it. S0r also wrote every internal edge the R1/S1 lanes need
# (enth-challenge in the solver, the session, the UI, the plugin, the CLI and the golden harness; enth-patch in xtask
# for `preset-add`): a new edge changes the depending crate's Cargo.lock entry and fails `--locked` just as a new
# crate does.
#
# No new crates.io crate yet. Report 03 picked `dirs` =7.0.0 (MIT OR Apache-2.0) for the user preset folder, but its
# `dirs-sys` 0.5.0 always pulls `option-ext` 0.2.0, which is MPL-2.0: not in deny.toml, so `cargo deny check licenses`
# fails and AGENTS.md needs the owner's OK first (lane S0r measured it, 2026-10-20). Until then the preset folder is
# found without it (lane PBC), or the owner allows MPL-2.0 for that one crate in deny.toml and the coordinator adds
# `dirs` here.

# Phase 3 (R2 Learn + R3 Sound to patch; docs/phase-3.md, the coordinator's pins, 2026-10-21). Licences read from the
# crates.io API; lanes S0l and S0s add each to the crate that uses it (that changes Cargo.lock), then the coordinator
# alone edits this table. `toml` and `rayon` above are reused (rayon also in enth-plugin for the create pool, L8 only).
# R2 (enth-learn, L5, wasm-checked): lesson markdown and the .enthpack reader.
pulldown-cmark = { version = "=0.13.4", default-features = false }   # MIT. Block AST of a lesson step (report 02 §3); no HTML output
rawzip = "=0.5.2"                                   # MIT. Zero-dependency zip reader for .enthpack; refuse renamed or duplicate entries (report 02 §5)
miniz_oxide = "=0.9.1"                              # MIT OR Zlib OR Apache-2.0. Deflate for .enthpack, pinned so `xtask pack` builds reproducibly
# R3 (enth-plugin and enth-cli, L8): audio decoders without MPL-2.0 (symphonia needs the owner's OK; report 03 §7). Lane S0s
# (F0s) made them dependencies: the CLI's, and the plugin's behind its `create` feature (with `hound` and `rayon` above), and
# resolved Cargo.lock (claxon, lewton with `ogg` and `byteorder`, nanomp3 with `nanomp3-core`).
claxon = "=0.4.3"                                   # Apache-2.0. FLAC
lewton = "=0.10.2"                                  # MIT OR Apache-2.0. Ogg Vorbis
nanomp3 = "=0.2.0"                                  # MIT OR Apache-2.0. MP3, a safe port of minimp3 (one maintainer: revisit if it stalls)

# The vendored fork of nice-plug and baseview (research session 2026-10-19-p1b-plugin-editor, summary.md, decision "Fork";
# lane FK). `vendor/` holds the crates.io sources (a pristine-import commit, then one commit per patch: slot rename,
# `editor_closed`, baseview's xkb unref, keyboard focus only while typing; see vendor/README.md). Every entry keeps its
# crates.io version, so the `=` pins above still match. `exclude = ["vendor"]` in `[workspace]` keeps the vendored
# crates out of fmt, clippy and `--workspace`. Vendored path dependencies are not lint-capped by cargo, so each vendored
# crate's own Cargo.toml caps its lints (vendor/README.md, "Lints"). egui-baseview is vendored because nice-plug-egui
# depends on it and the focus patch edits it; the patched baseview sits under it too.
[patch.crates-io]
nice-plug = { path = "vendor/nice-plug/crates/nice-plug" }
nice-plug-core = { path = "vendor/nice-plug/crates/nice-plug-core" }
nice-plug-egui = { path = "vendor/nice-plug/crates/nice-plug-egui" }
baseview = { path = "vendor/baseview" }
egui-baseview = { path = "vendor/egui-baseview" }

[workspace.lints.rust]
unsafe_code = "deny"                      # FFI crates opt out at the crate root: #![allow(unsafe_code, reason = "...")]
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
# `--cfg enth_rtsan` (nightly workflow) switches on `#[cfg_attr(enth_rtsan, sanitize(realtime = "nonblocking"))]` for RealtimeSanitizer.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(enth_rtsan)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that mostly fire on DSP arithmetic, or are taste:
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"                       # exact comparisons are deliberate in determinism tests; float_cmp_const stays on
many_single_char_names = "allow"          # x, y, a, b, q, g are normal DSP names
unreadable_literal = "allow"              # ported coefficients keep upstream digits verbatim, so they can be checked against the source
inline_always = "allow"                   # #[inline(always)] is deliberate in per-sample DSP code
similar_names = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Restriction lints worth having in an agent-written audio codebase:
allow_attributes_without_reason = "warn"  # every #[allow] says why
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"                     # core crates do no I/O; CLI and xtask opt out at the crate root
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
large_stack_arrays = "warn"
mem_forget = "warn"
exit = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
rc_mutex = "warn"

# Dev profile measured in research report 06 (spike-shell: clean 36→27 s, incremental 0.88→0.66 s, .clap 191→54 MB).
[profile.dev]
debug = "line-tables-only"        # file:line in panics and backtraces; full DWARF only where you ask for it

[profile.dev.package."*"]
debug = false                     # no DWARF for nice-plug, egui, baseview and other dependencies

# Real-time crates run optimised even in debug builds (debug assertions and overflow checks stay on).
# Add each L0-L2 crate that runs per-sample code. Don't optimise all dependencies:
# deps at opt-level 2 made clean builds 2.95x slower for about 0.4 s off each incremental build.
[profile.dev.package.enth-dsp]
opt-level = 3

[profile.dev.package.enth-engine]
opt-level = 3

# Analysis runs in every test that describes a render (about 1 s per describe unoptimised); its scalar paths are bit-identical across opt levels.
[profile.dev.package.enth-analysis]
opt-level = 3

# The solver (match, sensitivity, coach) and the game's scorers render many patches per test; unoptimised, a
# 40-render `enth match` took ~9 s (lane CL, 2026-10-20). Their scalar paths are bit-identical across opt levels.
[profile.dev.package.enth-solver]
opt-level = 3

[profile.dev.package.enth-challenge]
opt-level = 3

# The listening tool's fundsp comparison reverbs run in tests; unoptimised they add ~1.5 min to the workspace tests.
[profile.dev.package.fundsp]
opt-level = 3

# Profiling and heaptrack runs keep symbols without debug-build slowness: cargo build --profile profiling
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
