# the Do step's witness turns the cutoff, which its editable list leaves out.
schema = "enth.lesson/1"
id = "l"
title = "Fixture lesson"
tier = "basic"
objective = "Exercise one rule of lesson-check."
teaches = ["svf.cutoff"]

[[steps]]
id = "try"
kind = "do"
text = "text.md"
witness = "patches/dark.patch.json"

[steps.view]
start = "patches/saw.patch.json"
editable = ["filter1.resonance"]

[steps.check]
kind = "sound"
phrase = 1
expect = ["brightness<500Hz"]
