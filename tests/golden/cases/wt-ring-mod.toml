description = "WT: ring modulation, am 0 % with a route: a sine osc1 at +19 st (about 1:3) and level 0 into wt1.am at depth 100 %, the carrier the sine table, so the carrier itself is gone and only the sidebands sound (a bell-like pair); reset phases, through a gate envelope (attack 0, decay 0, sustain 100 %, release 0), so the case does not move when the envelope changes."
sample_rate = 48000
seconds = 0.5

[source]
kind = "patch"
notes = [
    { key = 57, velocity = 1.0, on_s = 0.0, off_s = 0.4 },
]

[source.patch]
schema = 1
engine = "0.1.0"
voice = { amp_env = "env1" }
generators = [
    { id = "osc1", kind = "osc", params = { wave = "sine", semi = 19, level = 0, phase_mode = "reset", phase = 0 } },
    { id = "wt1", kind = "wt", params = { am = 0 } },
]
modulators = [{ id = "env1", kind = "adsr", params = { attack = 0, decay = 0, sustain = 100, release = 0 } }]
routes = [
    { src = "osc1", dst = "wt1.am", depth = 100 },
]
