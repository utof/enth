description = "MSEG: edits in the middle of a note: a sustain loop on osc1.level (base 0, depth 100 %) holding point 2 (loop points 2 and 2), 1000 ms; automation drops point 2's level from 100 % to 40 % at 0.4 s and moves its time from 20 % to 5 % at 0.8 s; each edit glides over about 5 ms instead of clicking, through a gate envelope (attack 0, decay 0, sustain 100 %, release 0), so the case does not move when the envelope changes."
sample_rate = 48000
seconds = 1.3

[source]
kind = "patch"
notes = [
    { key = 50, velocity = 1.0, on_s = 0.0, off_s = 1.2 },
]
automation = [
    { time_s = 0.4, addr = "mseg1.level2", value = 40.0 },
    { time_s = 0.8, addr = "mseg1.time2", value = 5.0 },
]

[source.patch]
schema = 1
engine = "0.1.0"
voice = { amp_env = "env1" }
master = { level = -6 }
generators = [{ id = "osc1", kind = "osc", params = { wave = "saw", phase_mode = "reset", level = 0 } }]
modulators = [
    { id = "env1", kind = "adsr", params = { attack = 0, decay = 0, sustain = 100, release = 0 } },
    { id = "mseg1", kind = "mseg", params = { mode = "sustain_loop", sync = "off", length = 1000, loop_start = 2, loop_end = 2, points = 3, time1 = 0, level1 = 0, curve1 = 0, time2 = 20, level2 = 100, curve2 = 0, time3 = 100, level3 = 0, curve3 = 0 } },
]
routes = [
    { src = "mseg1", dst = "osc1.level", depth = 100.0 },
]
