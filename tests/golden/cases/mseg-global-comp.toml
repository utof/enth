description = "MSEG: a global loop (scope global, the only scope that may modulate effects), a three-point triangle every 667 ms, routed to comp1.mix at 40 % around 60 %, on a loud chord into the compressor (threshold -30 dB, ratio 8, attack 3 ms, release 80 ms, make-up 4 dB); the filter stays open at 4 kHz, through a gate envelope (attack 0, decay 0, sustain 100 %, release 0), so the case does not move when the envelope changes."
