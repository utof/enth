description = "MSEG: a one-shot attack-decay envelope, four points (0 to 100 % by 6 %, down to 30 % by 40 %, to 0 at the end, curves 50, -60, 0, -50), 1000 ms, routed to osc1.level (base 0, depth 100 %); a second note at 0.6 s starts its own (per-voice state), through a gate envelope (attack 0, decay 0, sustain 100 %, release 0), so the case does not move when the envelope changes."
sample_rate = 48000
seconds = 1.8

[source]
kind = "patch"
notes = [
    { key = 52, velocity = 1.0, on_s = 0.0, off_s = 1.5 },
    { key = 59, velocity = 0.8, on_s = 0.6, off_s = 1.5 },
]

[source.patch]
schema = 1
engine = "0.1.0"
voice = { amp_env = "env1" }
master = { level = -6 }
generators = [{ id = "osc1", kind = "osc", params = { wave = "saw", phase_mode = "reset", level = 0 } }]
modulators = [
    { id = "env1", kind = "adsr", params = { attack = 0, decay = 0, sustain = 100, release = 0 } },
    { id = "mseg1", kind = "mseg", params = { mode = "one_shot", sync = "off", length = 1000, points = 4, time1 = 0, level1 = 0, curve1 = 50, time2 = 6, level2 = 100, curve2 = -60, time3 = 40, level3 = 30, curve3 = 0, time4 = 100, level4 = 0, curve4 = -50 } },
]
routes = [
    { src = "mseg1", dst = "osc1.level", depth = 100.0 },
]
