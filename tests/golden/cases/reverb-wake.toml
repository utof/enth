description = "FXW: the reverb going idle and waking. A short tail (decay 100 ms) dies to exact zeros, the module reports itself silent and the engine skips it, parameters change while it is idle (room, wet, and the engine-smoothed low and high cuts, settled long before the second note), then a second note wakes it: it must sound like a fresh reverb with the new settings (pending changes applied at once, the detune LFO restarted at phase 0). Pins the idle detector's schedule too, since the wake point shows in the bits. The oscillator is the saw: lane D1 updates this case on purpose when it replaces the reference saw."
sample_rate = 48000
seconds = 3.5

[source]
kind = "patch"
notes = [
    { key = 60, velocity = 0.9, on_s = 0.0, off_s = 0.05 },
    { key = 67, velocity = 0.9, on_s = 2.5, off_s = 2.55 },
]
automation = [
    { time_s = 1.7, addr = "reverb1.room", value = 120.0 },
    { time_s = 1.7, addr = "reverb1.wet", value = -3.0 },
    { time_s = 1.71, addr = "reverb1.low_cut", value = 250.0 },
    { time_s = 1.72, addr = "reverb1.high_cut", value = 6000.0 },
]

[source.patch]
schema = 1
engine = "0.1.0"
voice = { amp_env = "env1" }
generators = [{ id = "osc1", kind = "osc", params = { wave = "saw", phase_mode = "reset" } }]
modulators = [{ id = "env1", kind = "adsr", params = { attack = 0, decay = 0, sustain = 100, release = 0 } }]
fx = [{ id = "reverb1", kind = "reverb", params = { decay = 100, room = 60, detune = 25, dry = -6, wet = 0 } }]
