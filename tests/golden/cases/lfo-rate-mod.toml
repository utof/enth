description = "P1a CH, an LFO modulating an LFO: lfo2 (0.4 Hz sine) routed to lfo1.rate at 8 % of its log range, lfo1 (3 Hz sine) on filter1.cutoff at 25 %. The phase of lfo1 must stay continuous while its rate moves, and lfo2 is a source that ticks after lfo1 in modulator order, so lfo1 reads its previous segment (the one-segment delay of the routing order). The reference voice goes through a gate envelope (attack 0, decay 0, sustain 100 %, release 0), so lane D2's envelope curves do not move it; the filter and the LFO are lane D2's modules."
sample_rate = 48000
seconds = 1.5

[source]
kind = "patch"
notes = [
    { key = 45, velocity = 0.8, on_s = 0.0, off_s = 1.3 },
]

[source.patch]
schema = 1
engine = "0.1.0"
voice = { amp_env = "env1" }
master = { level = -6 }
generators = [{ id = "osc1", kind = "osc", params = { wave = "saw", phase_mode = "reset" } }]
voice_fx = [{ id = "filter1", kind = "svf", params = { mode = "lp", cutoff = "600Hz", resonance = 30 } }]
modulators = [
    { id = "env1", kind = "adsr", params = { attack = 0, decay = 0, sustain = 100, release = 0 } },
    { id = "lfo1", kind = "lfo", params = { shape = "sine", rate = 3.0 } },
    { id = "lfo2", kind = "lfo", params = { shape = "sine", rate = 0.4 } },
]
routes = [
    { src = "lfo1", dst = "filter1.cutoff", depth = 25.0 },
    { src = "lfo2", dst = "lfo1.rate", depth = 8.0 },
]
