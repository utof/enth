description = "FXW: the compressor's response to level steps in the engine: one saw (0.05 to 0.4 s), then a four-note chord at four times the amplitude (0.4 to 1.0 s), then silence to 1.6 s, through the compressor at threshold -24 dB, ratio 4, hard knee, attack 10 ms, release 200 ms; attack automated to 50 ms mid-chord and release to 60 ms at the note-off (neither parameter is engine-smoothed, so lane S2b does not change this case). Guards the wrapper's pass-through of the catalogue values, the segment-rate set_params and the gain reduction's attack and release. The oscillator is the saw: lane D1 updates this case on purpose when it replaces the reference saw."
sample_rate = 48000
seconds = 1.6

[source]
kind = "patch"
notes = [
    { key = 69, velocity = 1.0, on_s = 0.05, off_s = 0.4 },
    { key = 69, velocity = 1.0, on_s = 0.4, off_s = 1.0 },
    { key = 73, velocity = 1.0, on_s = 0.4, off_s = 1.0 },
    { key = 76, velocity = 1.0, on_s = 0.4, off_s = 1.0 },
    { key = 81, velocity = 1.0, on_s = 0.4, off_s = 1.0 },
]
automation = [
    { time_s = 0.5003, addr = "comp1.attack", value = 50.0 },
    { time_s = 1.0003, addr = "comp1.release", value = 60.0 },
]

[source.patch]
schema = 1
engine = "0.1.0"
voice = { amp_env = "env1", polyphony = 8 }
generators = [{ id = "osc1", kind = "osc", params = { wave = "saw", phase_mode = "reset" } }]
modulators = [{ id = "env1", kind = "adsr", params = { attack = 0, decay = 0, sustain = 100, release = 0 } }]
fx = [{ id = "comp1", kind = "comp", params = { threshold = -24, ratio = 4, knee = 0, attack = 10, release = 200 } }]
