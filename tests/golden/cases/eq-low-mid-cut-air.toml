description = "S2a EQ: a low-mid cut and an air boost: bell 1 at 300 Hz, -5 dB, Q 1.2, and a high shelf at 10 kHz, +6 dB. The usual mix-bus clean-up. Guards the bell and the shelf together. The reference voice goes through a gate envelope (attack 0, decay 0, sustain 100 %, release 0) so lane D2's envelope curves do not move it, on a saw (lane D1's) chord of three notes with off-grid times."
sample_rate = 48000
seconds = 1.5

[source]
kind = "patch"
notes = [
    { key = 45, velocity = 1.0, on_s = 0.0, off_s = 0.9 },
    { key = 57, velocity = 0.9, on_s = 0.0171, off_s = 0.9 },
    { key = 64, velocity = 0.8, on_s = 0.3, off_s = 1.0 },
]

[source.patch]
schema = 1
engine = "0.1.0"
voice = { amp_env = "env1" }
generators = [{ id = "osc1", kind = "osc", params = { wave = "saw", phase_mode = "reset" } }]
fx = [
    { id = "eq1", kind = "eq", params = { bell1_freq = 300, bell1_gain = -5, bell1_q = 1.2, high_freq = "10kHz", high_gain = 6 } },
]
modulators = [
    { id = "env1", kind = "adsr", params = { attack = 0, decay = 0, sustain = 100, release = 0 } },
]
