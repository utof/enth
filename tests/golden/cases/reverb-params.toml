description = "FXW: the reverb away from its defaults (dry -3 dB, wet -9 dB, room 150 ms, decay 6 s, early 80 %, detune 12, low cut 200 Hz, high cut 5 kHz, damping 3 and 5), then the parameters the core fades itself moved mid-tail at off-grid times: room, decay, wet, detune, early. Only unsmoothed parameters are automated here, so lane S2b's engine smoothers do not change this case; the engine-smoothed cuts and damping are static. The oscillator is the saw: lane D1 updates this case on purpose when it replaces the reference saw."
sample_rate = 48000
seconds = 3.0

[source]
kind = "patch"
notes = [
    { key = 52, velocity = 0.9, on_s = 0.0, off_s = 0.45 },
    { key = 59, velocity = 0.9, on_s = 0.0137, off_s = 0.45 },
]
automation = [
    { time_s = 0.7003, addr = "reverb1.room", value = 60.0 },
    { time_s = 1.2, addr = "reverb1.decay", value = 1500.0 },
    { time_s = 1.5011, addr = "reverb1.wet", value = -3.0 },
    { time_s = 1.7, addr = "reverb1.detune", value = 3.0 },
    { time_s = 1.9, addr = "reverb1.early", value = 200.0 },
]

[source.patch]
schema = 1
engine = "0.1.0"
voice = { amp_env = "env1" }
generators = [{ id = "osc1", kind = "osc", params = { wave = "saw", phase_mode = "reset" } }]
modulators = [{ id = "env1", kind = "adsr", params = { attack = 0, decay = 0, sustain = 100, release = 0 } }]
fx = [{ id = "reverb1", kind = "reverb", params = { dry = -3, wet = -9, room = 150, decay = 6000, early = 80, detune = 12, low_cut = 200, high_cut = 5000, low_damp = 3, high_damp = 5 } }]
