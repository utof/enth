description = "WT unison: a stereo wt beside an osc, and as a source and a target of audio routes: osc1 (sine at +7 st, level 30 %) is heard and phase-modulates wt1 (four copies, detune 30 cents, spread 100 %, pm_index 1.5) at depth 40 %; wt1 phase-modulates wt2 (a plain wt at +12 st, pm_index 2, level 30 %) at depth 60 %. What the route to wt2 carries is wt1's mono mix before the spread (after AM, before its level), so wt2 is the same on both channels; reset phases, through a gate envelope (attack 0, decay 0, sustain 100 %, release 0), so the case does not move when the envelope changes."
sample_rate = 48000
seconds = 0.6

[source]
kind = "patch"
notes = [
    { key = 57, velocity = 1.0, on_s = 0.0, off_s = 0.5 },
]

[source.patch]
schema = 1
engine = "0.1.0"
voice = { amp_env = "env1" }
generators = [
    { id = "osc1", kind = "osc", params = { wave = "sine", semi = 7, level = 30, phase_mode = "reset", phase = 0 } },
    { id = "wt1", kind = "wt", params = { unison = 4, detune = 30, blend = 100, spread = 100, pm_index = 1.5, level = 60 } },
    { id = "wt2", kind = "wt", params = { semi = 12, pm_index = 2, level = 30 } },
]
modulators = [{ id = "env1", kind = "adsr", params = { attack = 0, decay = 0, sustain = 100, release = 0 } }]
routes = [
    { src = "osc1", dst = "wt1.pm", depth = 40 },
    { src = "wt1", dst = "wt2.pm", depth = 60 },
]
