description = "S2b voice manager, legato with glide: 80 ms, linear in semitones at constant time, glide mode 'always'. Overlapping notes change the pitch without a retrigger and glide (also back to the newest held key when the sounding one is released); a note played after the release glides from the previous pitch in a retriggered or fresh voice. The reference saw through a gate envelope, so lane D2's envelope does not move it; lane D1 updates it on purpose."
sample_rate = 48000
seconds = 1.5

