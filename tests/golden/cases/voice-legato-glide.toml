    { key = 57, velocity = 0.5, on_s = 0.2, off_s = 0.5 },
    { key = 52, velocity = 0.9, on_s = 0.3333, off_s = 0.4 },
    { key = 64, velocity = 0.7, on_s = 1.0, off_s = 1.3 },
]

