description = "S2a EQ: two eq modules in the fx chain: the first tilts (low shelf +6 dB at 120 Hz), the second cuts a bell (-14 dB at 3 kHz, Q 4) and rolls off at 9 kHz. Guards that each instance keeps its own state and the chain runs in order. The reference voice goes through a gate envelope (attack 0, decay 0, sustain 100 %, release 0) so lane D2's envelope curves do not move it, on a saw (lane D1's) chord of three notes with off-grid times."
sample_rate = 48000
seconds = 1.5

[source]
kind = "patch"
notes = [
    { key = 45, velocity = 1.0, on_s = 0.0, off_s = 0.9 },
    { key = 57, velocity = 0.9, on_s = 0.0171, off_s = 0.9 },
    { key = 64, velocity = 0.8, on_s = 0.3, off_s = 1.0 },
]

[source.patch]
schema = 1
engine = "0.1.0"
voice = { amp_env = "env1" }
generators = [{ id = "osc1", kind = "osc", params = { wave = "saw", phase_mode = "reset" } }]
fx = [
    { id = "eq1", kind = "eq", params = { low_freq = 120, low_gain = 6 } },
    { id = "eq2", kind = "eq", params = { bell1_freq = "3kHz", bell1_gain = -14, bell1_q = 4, high_cut = "9kHz" } },
]
modulators = [
    { id = "env1", kind = "adsr", params = { attack = 0, decay = 0, sustain = 100, release = 0 } },
]
