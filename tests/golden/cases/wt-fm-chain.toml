description = "WT: a wt as an FM operator and as a carrier: osc1 (sine, level 0) into wt2.pm at depth 70 % with wt2 at level 0 and pm_index 2, wt2 at +12 st into wt1.pm at depth 80 % with pm_index 3 (a three-operator chain, pre-level routes through a silent operator), wt1 the carrier at level 60 %; reset phases, through a gate envelope (attack 0, decay 0, sustain 100 %, release 0), so the case does not move when the envelope changes."
sample_rate = 48000
seconds = 0.5

[source]
kind = "patch"
notes = [
    { key = 57, velocity = 1.0, on_s = 0.0, off_s = 0.4 },
]

