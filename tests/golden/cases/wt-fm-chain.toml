schema = 1
engine = "0.1.0"
voice = { amp_env = "env1" }
generators = [
    { id = "osc1", kind = "osc", params = { wave = "sine", semi = 7, level = 0, phase_mode = "reset", phase = 0 } },
    { id = "wt2", kind = "wt", params = { semi = 12, level = 0, pm_index = 2 } },
    { id = "wt1", kind = "wt", params = { level = 60, pm_index = 3 } },
]
