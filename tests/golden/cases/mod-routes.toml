description = "S2b modulation matrix: routes from velocity (osc1.level, -40 %), key (voice.pan, +80 %), macro1 at 0.6 (osc1.fine, +15 %) and macro2 at 0.25 (osc1.semi, +12.5 %), depth as a share of each destination's normalised range, summed in route order, plus automation of a routed parameter (osc1.level, smoothed over 10 ms) and of master.level (smoothed over 20 ms). A three-note chord with different velocities across the keyboard. The reference saw through a gate envelope, so lane D2's envelope does not move it; lane D1 updates it on purpose."
sample_rate = 48000
seconds = 1.0

[source]
kind = "patch"
notes = [
    { key = 36, velocity = 1.0, on_s = 0.0, off_s = 0.8 },
    { key = 60, velocity = 0.5, on_s = 0.1, off_s = 0.8 },
    { key = 84, velocity = 0.2, on_s = 0.2, off_s = 0.8 },
]
automation = [
    { time_s = 0.4, addr = "osc1.level", value = 60.0 },
    { time_s = 0.6, addr = "master.level", value = -12.0 },
]

[source.patch]
schema = 1
engine = "0.1.0"
voice = { amp_env = "env1" }
generators = [{ id = "osc1", kind = "osc", params = { wave = "saw", phase_mode = "reset", phase = 90 } }]
modulators = [{ id = "env1", kind = "adsr", params = { attack = 0, decay = 0, sustain = 100, release = 0 } }]
routes = [
    { src = "velocity", dst = "osc1.level", depth = -40.0 },
    { src = "key", dst = "voice.pan", depth = 80.0 },
    { src = "macro1", dst = "osc1.fine", depth = 15.0 },
    { src = "macro2", dst = "osc1.semi", depth = 12.5 },
]
macros = [{ value = 0.6 }, { value = 0.25 }]
