description = "S2a MOD: a manual flange: a global triangle LFO at 0.7 Hz routed to chorus1.delay at 45 % of its range, and a depth automation step from 0 to 60 % at 0.6 s, on a saw at 110 Hz with the flanger at feedback 55 %. Guards the per-segment ramps of the delay (the read head moves while the line is read) and of depth, the Ctl cache and a global source driving a global effect."
sample_rate = 48000
seconds = 1.5

[source]
kind = "patch"
notes = [{ key = 45, velocity = 1.0, on_s = 0.0, off_s = 1.3 }]

automation = [
    { time_s = 0.6, addr = "chorus1.depth", value = 60.0 },
]

[source.patch]
schema = 1
engine = "0.1.0"
voice = { amp_env = "env1", polyphony = 8 }
master = { level = -6 }
generators = [{ id = "osc1", kind = "osc", params = { wave = "saw", phase_mode = "reset" } }]
modulators = [
    { id = "env1", kind = "adsr", params = { attack = 0, decay = 0, sustain = 100, release = 0 } },
    { id = "lfo1", kind = "lfo", params = { shape = "triangle", rate = 0.7, scope = "global" } },
]
fx = [{ id = "chorus1", kind = "chorus", params = { mode = "flanger", rate = 0.3, depth = 0, delay = 3, feedback = 55 } }]
routes = [
    { src = "lfo1", dst = "chorus1.delay", depth = 45.0 },
]
