description = "S2a EQ: every band at once and at the corners of the table: low cut 60 Hz, low shelf +24 dB at 300 Hz, bell 1 -24 dB Q 20 at 700 Hz, bell 2 +24 dB Q 0.1 at 2 kHz, high shelf -24 dB at 8 kHz, high cut 12 kHz. Guards the numeric range of the sections (a loud result, finite) and the cascade of six. The reference voice goes through a gate envelope (attack 0, decay 0, sustain 100 %, release 0) so lane D2's envelope curves do not move it, on a saw (lane D1's) chord of three notes with off-grid times."
sample_rate = 48000
seconds = 1.5

[source]
kind = "patch"
notes = [
    { key = 45, velocity = 1.0, on_s = 0.0, off_s = 0.9 },
    { key = 57, velocity = 0.9, on_s = 0.0171, off_s = 0.9 },
    { key = 64, velocity = 0.8, on_s = 0.3, off_s = 1.0 },
]

