description = "S2a MOD: a global sine LFO at 0.9 Hz routed to phaser1.center at 30 % of its range, depth 0 % (the notches follow the LFO alone, a manual sweep), and a stage-count automation step from 6 to 8 at 0.7 s that crossfades the taps over one block. Guards the per-segment ramps of the centre, a global source driving a global effect and the stage change without a click."
sample_rate = 48000
seconds = 1.5

[source]
kind = "patch"
notes = [{ key = 45, velocity = 1.0, on_s = 0.0, off_s = 1.3 }]

automation = [
    { time_s = 0.7, addr = "phaser1.stages", value = 8.0 },
]

[source.patch]
schema = 1
engine = "0.1.0"
voice = { amp_env = "env1", polyphony = 8 }
master = { level = -6 }
generators = [{ id = "osc1", kind = "osc", params = { wave = "saw", phase_mode = "reset" } }]
modulators = [
    { id = "env1", kind = "adsr", params = { attack = 0, decay = 0, sustain = 100, release = 0 } },
    { id = "lfo1", kind = "lfo", params = { shape = "sine", rate = 0.9, scope = "global" } },
]
fx = [{ id = "phaser1", kind = "phaser", params = { stages = 6, depth = 0, center = 900, feedback = 45 } }]
routes = [
    { src = "lfo1", dst = "phaser1.center", depth = 30.0 },
]
