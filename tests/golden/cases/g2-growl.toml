    { id = "mseg1", kind = "mseg", params = { mode = "loop", beats = "eighth", points = 5, time1 = 0, level1 = 5, curve1 = 60, time2 = 25, level2 = 100, curve2 = -40, time3 = 55, level3 = 40, curve3 = 30, time4 = 75, level4 = 80, curve4 = -30, time5 = 100, level5 = 5, curve5 = 0 } },
