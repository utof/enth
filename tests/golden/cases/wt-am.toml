description = "WT: unipolar amplitude modulation: a sine osc1 at +7 st and level 0 into wt1.am at depth 50 % with am at 100 % (the output times 1 + 0.5 m), the carrier the formant table at position 30 %; reset phases, through a gate envelope (attack 0, decay 0, sustain 100 %, release 0), so the case does not move when the envelope changes."
sample_rate = 48000
seconds = 0.5

[source]
kind = "patch"
notes = [
    { key = 57, velocity = 1.0, on_s = 0.0, off_s = 0.4 },
]

[source.patch]
schema = 1
engine = "0.1.0"
voice = { amp_env = "env1" }
generators = [
    { id = "osc1", kind = "osc", params = { wave = "sine", semi = 7, level = 0, phase_mode = "reset", phase = 0 } },
    { id = "wt1", kind = "wt", params = { table = "formant", position = 30, am = 100 } },
]
modulators = [{ id = "env1", kind = "adsr", params = { attack = 0, decay = 0, sustain = 100, release = 0 } }]
routes = [
    { src = "osc1", dst = "wt1.am", depth = 50 },
]
