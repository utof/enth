description = "P1a CH, the seeded phase mode: a sample & hold at 5 Hz with phase_mode seeded and seed 4321 on filter1.cutoff at 25 %, two notes and a non-default render seed. In seeded mode the stream comes from the module's own seed and the note index only, so the render seed does not move this case. The reference voice goes through a gate envelope (attack 0, decay 0, sustain 100 %, release 0), so lane D2's envelope curves do not move it; the filter and the LFO are lane D2's modules."
sample_rate = 48000
seconds = 1.5

[source]
kind = "patch"
seed = 987654321
notes = [
    { key = 45, velocity = 0.8, on_s = 0.0, off_s = 1.3 },
    { key = 52, velocity = 0.8, on_s = 0.55, off_s = 1.4 },
]

[source.patch]
schema = 1
engine = "0.1.0"
voice = { amp_env = "env1" }
master = { level = -6 }
generators = [{ id = "osc1", kind = "osc", params = { wave = "saw", phase_mode = "reset" } }]
voice_fx = [{ id = "filter1", kind = "svf", params = { mode = "lp", cutoff = "600Hz", resonance = 30 } }]
modulators = [
    { id = "env1", kind = "adsr", params = { attack = 0, decay = 0, sustain = 100, release = 0 } },
    { id = "lfo1", kind = "lfo", params = { shape = "sample_hold", rate = 5.0, phase_mode = "seeded", seed = 4321 } },
]
routes = [
    { src = "lfo1", dst = "filter1.cutoff", depth = 25.0 },
]
