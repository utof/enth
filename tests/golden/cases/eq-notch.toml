description = "S2a EQ: a notch: bell 1 at 440 Hz, -24 dB, Q 20 on a chord whose A is the notch. Guards the deepest, narrowest bell the table allows. The reference voice goes through a gate envelope (attack 0, decay 0, sustain 100 %, release 0) so lane D2's envelope curves do not move it, on a saw (lane D1's) chord of three notes with off-grid times."
