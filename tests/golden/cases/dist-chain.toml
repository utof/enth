description = "S2a DST: two dist modules in one chain, a soft clip at 12 dB then a sine fold at 9 dB with tone 4 kHz, on a saw at 110 Hz. Guards that each instance keeps its own state and the order of the chain."
sample_rate = 48000
seconds = 0.75

[source]
kind = "patch"
notes = [{ key = 45, velocity = 0.9, on_s = 0.0, off_s = 0.60 }]

[source.patch]
schema = 1
engine = "0.1.0"
voice = { amp_env = "env1" }
generators = [{ id = "osc1", kind = "osc", params = { wave = "saw", phase_mode = "reset" } }]
voice_fx = [
    { id = "dist1", kind = "dist", params = { drive = 12 } },
    { id = "dist2", kind = "dist", params = { mode = "sine_fold", drive = 9, tone = "4kHz" } },
]
modulators = [
    { id = "env1", kind = "adsr", params = { attack = 0, decay = 0, sustain = 100, release = 0 } },
]
