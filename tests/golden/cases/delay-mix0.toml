notes = [
    { key = 48, velocity = 0.9, on_s = 0.0, off_s = 0.6 },
    { key = 55, velocity = 0.9, on_s = 0.0, off_s = 0.6 },
    { key = 60, velocity = 0.9, on_s = 0.1, off_s = 0.6 },
]

[source.patch]
