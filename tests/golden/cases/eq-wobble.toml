description = "S2a EQ: gain and Q moved together: bell 1 at 600 Hz, +10 dB, Q 3, its gain moved by a 3 Hz triangle global LFO (depth 20 % of the 48 dB range) and its Q by the same LFO (depth 25 %). Guards two ramped parameters of one band. The reference voice goes through a gate envelope (attack 0, decay 0, sustain 100 %, release 0) so lane D2's envelope curves do not move it, on a saw (lane D1's) chord of three notes with off-grid times."
sample_rate = 48000
seconds = 1.5

[source]
kind = "patch"
notes = [
    { key = 45, velocity = 1.0, on_s = 0.0, off_s = 0.9 },
    { key = 57, velocity = 0.9, on_s = 0.0171, off_s = 0.9 },
    { key = 64, velocity = 0.8, on_s = 0.3, off_s = 1.0 },
]

[source.patch]
schema = 1
engine = "0.1.0"
voice = { amp_env = "env1" }
generators = [{ id = "osc1", kind = "osc", params = { wave = "saw", phase_mode = "reset" } }]
fx = [
    { id = "eq1", kind = "eq", params = { bell1_freq = 600, bell1_gain = 10, bell1_q = 3 } },
]
modulators = [
    { id = "env1", kind = "adsr", params = { attack = 0, decay = 0, sustain = 100, release = 0 } },
    { id = "lfo1", kind = "lfo", params = { shape = "triangle", rate = 3, scope = "global" } },
]
routes = [
    { src = "lfo1", dst = "eq1.bell1_gain", depth = 20.0 },
    { src = "lfo1", dst = "eq1.bell1_q", depth = 25.0 },
]
