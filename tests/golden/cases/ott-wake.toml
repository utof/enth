description = "OTT: two 0.3 s notes 1.5 s apart at time 10 % and depth 100 %: the module goes idle in the gap (its filters, followers and smoothers reach exact zero, and the engine skips it) and wakes on the second note. Guards the idle and skip path, through a gate envelope (attack 0, decay 0, sustain 100 %, release 0), so the case does not move when the envelope curves change."
sample_rate = 48000
seconds = 2.4

