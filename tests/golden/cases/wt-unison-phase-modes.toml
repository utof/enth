description = "WT unison: the three phase modes with four copies each on the fm table at position 40 %: wt1 reset (module id and copy index, the phase knob a common rotation: 90 degrees), wt2 free (render seed, voice, copy index) and wt3 seeded (seed 7 and copy index), detune 15 cents, spread 70 %, level 25 % each, three notes in a row so each note starts at its own phases in free and seeded mode; through a gate envelope (attack 0, decay 0, sustain 100 %, release 0), so the case does not move when the envelope changes."
sample_rate = 48000
seconds = 1.2

[source]
kind = "patch"
notes = [
    { key = 57, velocity = 1.0, on_s = 0.0, off_s = 0.25 },
    { key = 57, velocity = 1.0, on_s = 0.4, off_s = 0.65 },
    { key = 57, velocity = 1.0, on_s = 0.8, off_s = 1.05 },
]

[source.patch]
schema = 1
engine = "0.1.0"
voice = { amp_env = "env1" }
generators = [
    { id = "wt1", kind = "wt", params = { table = "fm", position = 40, unison = 4, detune = 15, spread = 70, phase_mode = "reset", phase = 90, level = 25 } },
    { id = "wt2", kind = "wt", params = { table = "fm", position = 40, unison = 4, detune = 15, spread = 70, phase_mode = "free", semi = 12, level = 25 } },
    { id = "wt3", kind = "wt", params = { table = "fm", position = 40, unison = 4, detune = 15, spread = 70, phase_mode = "seeded", seed = 7, semi = -12, level = 25 } },
]
modulators = [{ id = "env1", kind = "adsr", params = { attack = 0, decay = 0, sustain = 100, release = 0 } }]
