description = "S2b voice manager, poly with glide mode 'legato' (60 ms): a note played while another key is held starts its voice at the previous note-on's pitch and glides to its own; a note played with no key held does not glide. Two saws (osc2 an octave down and 7 ct sharp, free phase from the render seed) through a gate envelope, so lane D2's envelope does not move it; lane D1 updates it on purpose."
sample_rate = 48000
seconds = 1.2

[source]
kind = "patch"
notes = [
    { key = 60, velocity = 0.8, on_s = 0.0, off_s = 0.5 },
    { key = 67, velocity = 0.8, on_s = 0.25, off_s = 0.6 },
    { key = 72, velocity = 0.8, on_s = 0.8, off_s = 1.0 },
]

[source.patch]
schema = 1
engine = "0.1.0"
voice = { amp_env = "env1", polyphony = 4, glide = 60, glide_mode = "legato" }
generators = [
    { id = "osc1", kind = "osc", params = { wave = "saw" } },
    { id = "osc2", kind = "osc", params = { wave = "saw", semi = -12, fine = 7, level = 50 } },
]
modulators = [{ id = "env1", kind = "adsr", params = { attack = 0, decay = 0, sustain = 100, release = 0 } }]
