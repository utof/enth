description = "S2a FLT, comb teeth: a saw at 110 Hz (key 45) through a comb at its defaults except feedback 90 %: key tracking 100 % puts the teeth on the saw's harmonics, so the saw rings and keeps its level (the gain at a tooth is 0 dB at every feedback). Gate envelope so only the comb and the saw are in the chain. Guards the delay maths (one period less the loop low-pass's phase delay), the four-point interpolator and the level bound."
sample_rate = 48000
seconds = 0.75

[source]
kind = "patch"
notes = [{ key = 45, velocity = 0.8, on_s = 0.0, off_s = 0.6 }]

[source.patch]
schema = 1
engine = "0.1.0"
voice = { amp_env = "env1" }
generators = [{ id = "osc1", kind = "osc", params = { wave = "saw", phase_mode = "reset" } }]
voice_fx = [{ id = "comb1", kind = "comb", params = { feedback = 90 } }]
modulators = [{ id = "env1", kind = "adsr", params = { attack = 0, decay = 0, sustain = 100, release = 0 } }]
