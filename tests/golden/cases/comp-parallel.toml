description = "FXW: parallel compression: a three-note chord with off-grid times through the compressor at threshold -30 dB, ratio 10, knee 12 dB, attack 3 ms, release 80 ms, make-up 6 dB and mix 50 %. All values static (threshold, ratio, knee, make-up and mix are engine-smoothed once lane S2b lands, but a settled smoother delivers them exactly). Guards the mix algebra (half dry, half compressed with make-up) and the soft knee through the module. The oscillator is the saw: lane D1 updates this case on purpose when it replaces the reference saw."
sample_rate = 48000
seconds = 1.5

[source]
kind = "patch"
notes = [
    { key = 45, velocity = 1.0, on_s = 0.0, off_s = 0.7 },
    { key = 57, velocity = 1.0, on_s = 0.0171, off_s = 0.7 },
    { key = 64, velocity = 1.0, on_s = 0.3, off_s = 0.9 },
]

