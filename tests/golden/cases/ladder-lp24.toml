description = "S2a FLT, the default mode: a 110 Hz saw (key 45) through the 24 dB/octave ladder at 600 Hz, resonance 40 %, with a one-shot envelope (700 ms decay) opening the cutoff by 35 % of its log range (to about 6 kHz) and falling back. Guards the four-stage solve, the per-sample coefficient ramps along a sweep and the log-scale route depth."
sample_rate = 48000
seconds = 1.2

[source]
kind = "patch"
notes = [{ key = 45, velocity = 0.8, on_s = 0.0, off_s = 1.1 }]

