modulators = [
    { id = "env1", kind = "adsr", params = { attack = 0, decay = 0, sustain = 100, release = 0 } },
    { id = "env2", kind = "adsr", params = { attack = 0, decay = 700, sustain = 0, release = 0 } },
]
routes = [
    { src = "env2", dst = "ladder1.cutoff", depth = 35 },
]
