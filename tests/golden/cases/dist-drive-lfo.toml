description = "S2a DST: soft clip at 12 dB drive with a 3 Hz sine LFO on drive (40 % of the range) and on bias (15 %), on a sine at 220 Hz. Guards the per-segment ramps of the controls and the Ctl cache."
sample_rate = 48000
seconds = 0.75

[source]
kind = "patch"
notes = [{ key = 57, velocity = 0.9, on_s = 0.0, off_s = 0.60 }]

[source.patch]
schema = 1
engine = "0.1.0"
voice = { amp_env = "env1" }
generators = [{ id = "osc1", kind = "osc", params = { wave = "sine", phase_mode = "reset" } }]
voice_fx = [
    { id = "dist1", kind = "dist", params = { drive = 12 } },
]
modulators = [
    { id = "env1", kind = "adsr", params = { attack = 0, decay = 0, sustain = 100, release = 0 } },
    { id = "lfo1", kind = "lfo", params = { shape = "sine", rate = 3 } },
]
routes = [
    { src = "lfo1", dst = "dist1.drive", depth = 40.0 },
    { src = "lfo1", dst = "dist1.bias", depth = 15.0 },
]
