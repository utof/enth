description = "S2a EQ: mix at 50 %: a bell at 1 kHz, +18 dB, Q 2 and a low cut at 300 Hz, half wet and half dry. Guards the mix algebra (wet*m + dry*(1-m)) through the module. The reference voice goes through a gate envelope (attack 0, decay 0, sustain 100 %, release 0) so lane D2's envelope curves do not move it, on a saw (lane D1's) chord of three notes with off-grid times."
sample_rate = 48000
seconds = 1.5

