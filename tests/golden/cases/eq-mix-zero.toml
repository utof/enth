description = "S2a EQ: mix at 0 % with the bands set hard: the output is the dry chord bit for bit (tests/eq.rs pins it against the render without the eq), while the sections keep running. Guards that mix 0 is a true bypass. The reference voice goes through a gate envelope (attack 0, decay 0, sustain 100 %, release 0) so lane D2's envelope curves do not move it, on a saw (lane D1's) chord of three notes with off-grid times."
sample_rate = 48000
seconds = 1.5

