# --- Check: "which has drive?" on the saw (PLAN: needed; clean against 24 dB), then which is driven harder on the
# sine (12 against 24 dB).
[[steps]]
id = "check-saw"
kind = "choose"
text = "check-saw.md"
hints = ["The driven saw is denser and rougher; the clean one smoother."]
answer = 0

[[steps.options]]
label = "A"
patch = "patches/saw-drive-24.patch.json"

[[steps.options]]
label = "B"
patch = "patches/saw-drive-0.patch.json"

[[steps]]
id = "check-harder"
kind = "choose"
text = "check-harder.md"
hints = ["More drive, more buzz on top of the tone."]
answer = 1

[[steps.options]]
label = "A"
patch = "patches/sine-drive-12.patch.json"

[[steps.options]]
label = "B"
patch = "patches/sine-drive-24.patch.json"
