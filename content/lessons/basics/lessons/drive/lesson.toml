# --- Do, round 3: on the saw, where drive is subtler. Seed 4 draws 24 dB (the start scores 52.2; 12 dB scores 71.9,
# 18 dB 88.9).
[[steps]]
id = "round-3"
kind = "recreate"
text = "round-3.md"
hints = [
  "On a saw, drive makes the sound denser and rougher rather than brighter.",
  "Compare the edges of the two sounds, not their loudness.",
]

[steps.view]
highlight = ["filter1.drive"]
hide = ["osc2.*", "noise1.*", "env2.*", "lfo1.*", "lfo2.*", "comp1.*", "reverb1.*"]

