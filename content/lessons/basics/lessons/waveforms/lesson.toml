[steps.challenge.meta]
title = "Waveforms, round 3"
tags = ["basics", "waveforms"]

# --- Check: two ear questions. "Pulse or saw?" an octave down (PLAN: needed, since the descriptors read the two
# alike), then "which is the triangle?" among the four waves on the pad at C4.
[[steps]]
id = "check-pulse"
kind = "choose"
text = "check-pulse.md"
hints = ["The pulse is hollow, like a clarinet; the saw is full and brassy."]
answer = 1

[[steps.options]]
label = "A"
patch = "patches/saw.patch.json"
transpose = -12

[[steps.options]]
label = "B"
patch = "patches/pulse.patch.json"
transpose = -12

[[steps]]
id = "check-triangle"
kind = "choose"
text = "check-triangle.md"
hints = ["The sine is the softest; the triangle is a little brighter, mellow like a flute."]
answer = 2

[[steps.options]]
label = "A"
patch = "patches/pad.patch.json"
transpose = 12

[[steps.options]]
label = "B"
patch = "patches/pad-sine.patch.json"
transpose = 12

[[steps.options]]
label = "C"
patch = "patches/pad-triangle.patch.json"
transpose = 12

[[steps.options]]
label = "D"
patch = "patches/pad-pulse.patch.json"
transpose = 12
