pass_mark = 90

[steps.challenge.meta]
title = "Pulse width, round 2"
tags = ["basics", "pulse-width"]

# --- Do, round 3: the same widths on a pulse an octave down (C2 through HELD, its semitones locked at -12). Seed 5
# draws 30 % (the start scores 60.2).
[[steps]]
id = "round-3"
kind = "recreate"
text = "round-3.md"
hints = [
  "Hollow and full means near 50 %; thin and nasal means narrow.",
  "Turn the width down from 50 % in steps and compare each with the target.",
]

[steps.view]
highlight = ["osc1.pw"]
hide = ["osc2.*", "noise1.*", "env2.*", "lfo1.*", "lfo2.*", "comp1.*", "reverb1.*"]

[steps.challenge]
schema = "enth.challenge/2"
answer = "patch"
phrase = 1

[steps.challenge.target]
kind = "draw"
seed = 5
items = [{ param = "osc1.pw", set = [10.0, 30.0] }]

[steps.challenge.start]
kind = "patch"

[steps.challenge.start.patch]
schema = 1
engine = "0.3.0"
meta = { name = "Pulse, an octave down", description = "A 50 % pulse an octave down (osc1.semi -12)." }
master = { level = -12.0 }
generators = [
  { id = "osc1", kind = "osc", params = { wave = "pulse", semi = -12.0 } },
  { id = "osc2", kind = "osc", enabled = false },
  { id = "noise1", kind = "noise", enabled = false },
]
voice_fx = [{ id = "filter1", kind = "svf" }]
fx = [
  { id = "comp1", kind = "comp", enabled = false },
  { id = "reverb1", kind = "reverb", enabled = false },
]
modulators = [
  { id = "env1", kind = "adsr" },
  { id = "env2", kind = "adsr" },
  { id = "lfo1", kind = "lfo" },
  { id = "lfo2", kind = "lfo" },
]

[steps.challenge.constraints]
editable = ["osc1.pw"]
locked = ["osc1.wave", "osc1.semi", "filter1.*"]

[steps.challenge.assists]
live_meter = false
dim_unused = false

[steps.challenge.scoring]
sound = "sound/1"
structure = "structure/1"
combined = "combined/1"
time = "time/1"
sound_weight = 50
pass_mark = 90

[steps.challenge.meta]
title = "Pulse width, round 3"
tags = ["basics", "pulse-width"]

# --- Check: which is the 10 % pulse (of 50, 25 and 10 %), then pulse or saw (the 10 % pulse against the saw: the
# confusable pair; they score 87.6 against each other).
[[steps]]
id = "check-narrowest"
kind = "choose"
text = "check-narrowest.md"
hints = ["The narrowest pulse is the thinnest and most nasal."]
answer = 2

[[steps.options]]
label = "A"
patch = "patches/pulse-pw-25.patch.json"

[[steps.options]]
label = "B"
patch = "patches/pulse.patch.json"

[[steps.options]]
label = "C"
patch = "patches/pulse-pw-10.patch.json"

[[steps]]
id = "check-saw"
kind = "choose"
text = "check-saw.md"
hints = ["A saw is full and brassy; a narrow pulse is thin and reedy."]
answer = 0

[[steps.options]]
label = "A"
patch = "patches/pulse-pw-10.patch.json"

[[steps.options]]
label = "B"
patch = "patches/saw.patch.json"
