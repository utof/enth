# Lesson 1.3, Pulse width [basics · intermediate] (content/lessons/PLAN.md §5, U1).
#
# Hear (50, 25 and 10 % on a pulse at C3 and C2, and a saw), a "which one is thinner?" item → Name → Try ("thinner
# than this", a patch goal) → three rounds (the width drawn from 10 and 30 %, twice at C3, once an octave down) → two ear
# questions. Only widths of 50 % or less are drawn: a width and its mirror (100 minus it) sound alike. No sound check:
# the spectral centroid barely moves with the width (767 Hz at 50 %, 779 Hz at 20 %, 855 Hz at 10 %; PLAN's S~ probe),
# so the Try is a patch goal and the rounds carry the non-patch check. Measured on engine 0.3.0, HELD (C3 for 1.5 s).

schema = "enth.lesson/1"
id = "pulse-width"
title = "Pulse width"
tier = "intermediate"
objective = "Narrow a pulse wave from hollow to thin and nasal, and match a width by ear."
teaches = ["osc.pw"]

# --- Hear: a pulse at 50, 25 and 10 % at C3, then 50 and 10 % an octave down, then a saw for comparison.
[[steps]]
id = "hear"
kind = "listen"
text = "hear.md"

[[steps.examples]]
label = "Pulse, 50 %"
patch = "patches/pulse.patch.json"

[[steps.examples]]
label = "Pulse, 25 %"
patch = "patches/pulse-pw-25.patch.json"

[[steps.examples]]
label = "Pulse, 10 %"
patch = "patches/pulse-pw-10.patch.json"

[[steps.examples]]
label = "Low pulse, 50 %"
patch = "patches/pulse.patch.json"
transpose = -12

[[steps.examples]]
label = "Low pulse, 10 %"
patch = "patches/pulse-pw-10.patch.json"
transpose = -12

[[steps.examples]]
label = "Saw"
patch = "patches/saw.patch.json"

# --- Hear's ear question: which one is thinner? (50 % against 10 %.)
[[steps]]
id = "which-thinner"
kind = "choose"
text = "which-thinner.md"
hints = ["A square sounds hollow and woody; a narrow pulse sounds pinched, like a reed."]
answer = 1

[[steps.options]]
label = "A"
patch = "patches/pulse.patch.json"

[[steps.options]]
label = "B"
patch = "patches/pulse-pw-10.patch.json"

# --- Name.
[[steps]]
id = "name"
kind = "read"
text = "name.md"

[steps.view]
highlight = ["osc1.pw"]

# --- Try: "thinner than this" (PLAN: the width below 30 %), from the 50 % pulse; the witness is 25 %. A patch goal:
# see the header for why there is no sound check.
[[steps]]
id = "try"
kind = "do"
text = "try.md"
hints = [
  "Pulse width is on the oscillator card; it only does anything on the pulse wave.",
  "Turn it down, below 30 %. Going above 50 % sounds the same as going below.",
]
witness = "patches/pulse-pw-25.patch.json"

[steps.view]
layout = "focus"
start = "patches/pulse.patch.json"
highlight = ["osc1.pw"]
editable = ["osc1.pw"]
locked = ["osc1.wave", "osc1.semi", "filter1.*"]

[steps.check]
kind = "patch"
predicates = [{ kind = "value", knob = "osc1.pw", cmp = "<", value = "30%" }]

# --- Do, round 1: a hidden width, drawn from 10 and 30 % (PLAN's {10, 30, 50} with the 50 % start left out). Seed 5
# draws 30 % (the start scores sound 52.4). sound/1 separates the widths at the default pass mark: against 10 %, 30 %
# scores 79.1 and 20 % 86.0; against 30 %, 10 % scores 73.1 and 40 % 89.5.
[[steps]]
id = "round-1"
kind = "recreate"
text = "round.md"
hints = [
  "Hollow and full means near 50 %; thin and nasal means narrow.",
  "Turn the width down from 50 % in steps and compare each with the target.",
]

[steps.view]
highlight = ["osc1.pw"]
hide = ["osc2.*", "noise1.*", "env2.*", "lfo1.*", "lfo2.*", "comp1.*", "reverb1.*"]

[steps.challenge]
schema = "enth.challenge/2"
answer = "patch"
phrase = 1

[steps.challenge.target]
kind = "draw"
seed = 5
items = [{ param = "osc1.pw", set = [10.0, 30.0] }]

[steps.challenge.start]
kind = "patch"

[steps.challenge.start.patch]
schema = 1
engine = "0.3.0"
meta = { name = "Pulse", description = "The starter with a 50 % pulse (a square)." }
master = { level = -12.0 }
generators = [
  { id = "osc1", kind = "osc", params = { wave = "pulse" } },
  { id = "osc2", kind = "osc", enabled = false },
  { id = "noise1", kind = "noise", enabled = false },
]
voice_fx = [{ id = "filter1", kind = "svf" }]
fx = [
  { id = "comp1", kind = "comp", enabled = false },
  { id = "reverb1", kind = "reverb", enabled = false },
]
modulators = [
  { id = "env1", kind = "adsr" },
  { id = "env2", kind = "adsr" },
  { id = "lfo1", kind = "lfo" },
  { id = "lfo2", kind = "lfo" },
]

[steps.challenge.constraints]
editable = ["osc1.pw"]
locked = ["osc1.wave", "osc1.semi", "filter1.*"]

[steps.challenge.assists]
live_meter = false
dim_unused = false

[steps.challenge.scoring]
sound = "sound/1"
structure = "structure/1"
combined = "combined/1"
time = "time/1"
sound_weight = 50
pass_mark = 90

[steps.challenge.meta]
title = "Pulse width, round 1"
tags = ["basics", "pulse-width"]

# --- Do, round 2: the same widths, seed 1: 10 % (the start scores 59.0).
[[steps]]
id = "round-2"
kind = "recreate"
text = "round.md"
hints = [
  "Hollow and full means near 50 %; thin and nasal means narrow.",
  "Turn the width down from 50 % in steps and compare each with the target.",
]

[steps.view]
highlight = ["osc1.pw"]
hide = ["osc2.*", "noise1.*", "env2.*", "lfo1.*", "lfo2.*", "comp1.*", "reverb1.*"]

[steps.challenge]
