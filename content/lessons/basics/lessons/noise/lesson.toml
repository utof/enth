# --- Do: the colour, on noise alone (osc1 at 0 %), where it is plain. Measured: white noise through the 2 kHz low-pass
# reads a spectral centroid of 2615 Hz (the start: fails `brightness<2000Hz` by 615 Hz), pink 1479 Hz (the witness:
# passes by 521 Hz). The filter is locked, so only the colour can darken it.
[[steps]]
id = "colour"
kind = "do"
text = "colour.md"
hints = ["Switch noise1's Color from white to pink."]
witness = "patches/noise-pink.patch.json"

[steps.view]
layout = "focus"
start = "patches/noise-white.patch.json"
highlight = ["noise1.color"]
editable = ["noise1.color"]
locked = ["osc1.*", "filter1.*", "noise1.level"]

[steps.check]
kind = "all"

[[steps.check.checks]]
kind = "patch"
predicates = [{ kind = "value", knob = "noise1.color", cmp = "==", value = "pink" }]

[[steps.check.checks]]
kind = "sound"
phrase = 1
expect = ["brightness<2000Hz"]

# --- Check: white or pink, on noise alone (PLAN), then which has more hiss (30 % against 100 % under the saw).
[[steps]]
id = "check-pink"
kind = "choose"
text = "check-pink.md"
hints = ["Pink noise is the softer, darker one, like rain; white is brighter, like steam."]
answer = 0

[[steps.options]]
label = "A"
patch = "patches/noise-pink.patch.json"

[[steps.options]]
label = "B"
patch = "patches/noise-white.patch.json"

[[steps]]
id = "check-more"
kind = "choose"
text = "check-more.md"
hints = ["Ignore the note; listen only to the hiss around it."]
answer = 1

[[steps.options]]
label = "A"
patch = "patches/saw-noise-30.patch.json"

[[steps.options]]
label = "B"
patch = "patches/saw-noise-100.patch.json"
