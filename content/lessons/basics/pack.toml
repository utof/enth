# The basics pack (lane C1, R2): sources, the filter and the amplitude envelope, units U0 to U3 of the lesson plan
# (content/lessons/PLAN.md §2), in the authoring layout of docs/learn.md ("The lesson model (lane LM)"). `cargo xtask
# pack` (lane LCK) turns it into canonical JSON and a reproducible .enthpack; until then
# `crates/enth-learn/tests/basics_pack.rs` reads it with this build's reader.
#
# Conventions of this pack:
#   - every patch is the starter (Init) with a few values changed, at master -12 dB for headroom (two oscillators,
#     noise and drive stay below -10 dBFS); `patches/` is shared by the lessons;
#   - a lesson is Hear (listen steps, one ear question), Name (a read step of about 80 words), Try (a do step: a goal
#     checked live, with a sound check), Do (two or three recreate steps, real rounds on a drawn target) and Check (ear
#     questions), as report 01 §3 and docs/learn.md "The lesson shape" say;
#   - a recreate step's start is inline (a challenge holds whole patches), written sparse: every parameter not named
#     is the catalogue default, which is the starter's value.

schema = "enth.pack/1"
id = "basics"
version = "0.1.0"
title = "Synth basics"
authors = ["enth contributors"]
covers = ["osc", "noise", "svf", "adsr"]
# The order the app offers them in (the curriculum's order). Lesson ids are append-only.
lessons = ["waveforms", "two-oscillators", "noise", "cutoff", "decay-and-sustain"]

[license]
text = "CC-BY-4.0"
patches = "CC0-1.0"

# Recreate steps embed `enth.challenge/2` draws (and 1.1's last round is a generated level-1 target, generator 1),
# scored by the Recreate defaults.
[requires]
lesson = 1
challenge = 2
patch = 1
scorers = ["combined/1", "sound/1", "structure/1", "time/1"]
