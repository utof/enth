# One lesson in the authoring layout. Provisional, like pack.toml: lane LM freezes the fields at F1l. The shape is
# docs/learn.md's: Hear, then Try (a goal checked live), the steps' texts in step-N.md next to this file.

id = "cutoff"
title = "The low-pass cutoff"
tier = "basic"
objective = "Turn the low-pass filter's cutoff down and hear the sound get darker."
teaches = ["svf.cutoff"]

# Step 1, Hear: two renders that differ only in the cutoff, before anything is explained.
[[step]]
id = "hear"
kind = "listen"
text = "step-1.md"

[[step.example]]
label = "Open"
patch = "patches/saw.patch.json"

[[step.example]]
label = "Closed"
patch = "patches/dark.patch.json"

# Step 2, Try: "make it darker than this", checked live from the start patch. Only the new control is editable.
[[step]]
id = "try"
kind = "do"
text = "step-2.md"
start = "patches/saw.patch.json"
editable = ["filter1.cutoff"]

# A sound check: the held note C3 for 1.5 s (the phrase `held`), with the expectation grammar of `enth check`. The
# start must fail it and the witness must pass it by a margin of at least 1e-3. Measured on the engine at 0.3.0 with
# `enth check`: the start's spectral centroid is 894 Hz (fails), the witness's is 321 Hz (passes by 179 Hz).
[step.check.sound]
phrase = "held"
expect = "brightness<500Hz"

# The reference solution `lesson-check` plays through a session: it may touch editable controls only.
[step.witness]
patch = "patches/dark.patch.json"
