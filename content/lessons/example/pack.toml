# The example pack: one tiny lesson in the authoring layout (docs/learn.md, "The lesson model (lane LM)"). It exists so
# the layout, the CI workflow and the lesson tooling have something real to read. It is NOT bundled and NOT a lesson to
# ship (the plugin bundles `basics`; its tests use this pack, built to crates/enth-plugin/packs/example.enthpack and
# pinned like a bundled pack, as a small fixture); lanes C1 to C3 write the real packs beside it. Lane LM froze the schema at F1l and rewrote this file to it;
# `crates/enth-learn/tests/example_pack.rs` reads this directory, seals it and plays it, so it stays valid.
#
# Authors write TOML (comments, multi-line text); `cargo xtask pack` turns each file into canonical JSON and seals the
# manifest (`Manifest::seal`: every file with its size and SHA-256, the engine stamped) into a reproducible .enthpack.
#
# Layout (one owner per pack directory):
#   pack.toml                    this manifest (built into pack.json, `enth.pack/1`); it lists no files
#   lessons/<id>/lesson.toml     one lesson (built into lessons/<id>/lesson.json, `enth.lesson/1`); <id> is its id
#   lessons/<id>/<name>.md       the texts of its steps, a small markdown subset (headings, bold, bullets, `enth:` links)
#   patches/<name>.patch.json    exactly Patch::to_json(): starts, examples, options and witnesses
#   CREDITS.md                   authors and licences, shown in the app (required)
#   media/                       reserved, empty in v1 (no audio, no images)

schema = "enth.pack/1"
id = "example"
version = "0.1.0"
title = "Example pack"
authors = ["enth contributors"]
covers = ["svf"]
# The order the app offers the lessons in. Lesson ids are append-only: progress is keyed by pack, lesson and step ids.
lessons = ["cutoff"]

[license]
text = "CC-BY-4.0"
patches = "CC0-1.0"

# The highest schemas, generator and scorers this pack uses: the pack loads only if the build has them all, and the
# reader refuses a pack whose lessons use more than it declares. No Recreate step here, so no challenge, generator or
# scorer. `patch` is the patch file's `schema` (1), not the engine version.
[requires]
lesson = 1
patch = 1

# A track (Q1): an ordered list of lessons the app plays across installed packs, `pack/lesson`. The 12-lesson tour is
# one, carried by the pack that starts it; a lesson whose pack is missing is shown as missing.
[[tracks]]
id = "tour"
title = "The example tour"
lessons = ["example/cutoff"]
