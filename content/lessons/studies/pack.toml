# The studies pack (lane DEC, R2): six sound-design studies, unit U9 of the lesson plan (content/lessons/PLAN.md §2 and
# §5, "U9 Studies"), in the authoring layout of docs/learn.md ("The lesson model (lane LM)"). `cargo xtask pack` (lane
# LCK) turns it into canonical JSON and a reproducible .enthpack; until then `crates/enth-learn/tests/studies_pack.rs`
# reads it with this build's reader.
#
# Each study is a deconstruct lesson generated by `cargo xtask lesson-gen studies` (tools/lesson/src/gen.rs) from one
# preset candidate (content/presets-candidates/): the preset is taken apart by ablation, what is inaudible is left in
# from the start as fine detail, and the rest is rebuilt step by step in signal-flow order (docs/learn.md,
# "Deconstruct lessons (lane DEC)"). The steps, checks and patches are generated, with what was measured as comments
# in each lesson.toml; the texts (*.md) are edited by hand, and a regeneration keeps them.
#
# GR3 hygiene (content/gr3/README.md): Acid Snap and Breath Flute are in GR3's held-out test half. They may appear in
# lessons, but this pack's patches must never feed R3's training, priors, templates or k-NN bank.

schema = "enth.pack/1"
id = "studies"
version = "0.1.0"
title = "Sound-design studies"
authors = ["enth contributors"]
covers = ["osc", "noise", "svf", "adsr", "lfo", "reverb"]
# PLAN.md's order: 9.1 bass, 9.2 plucks and keys, 9.3 pads, 9.4 leads, 9.5 percussion, 9.6 FX and texture. Ids are
# append-only.
lessons = ["bass", "plucks", "pads", "leads", "percussion", "textures"]

[license]
text = "CC-BY-4.0"
patches = "CC0-1.0"

# Every Recreate step embeds an `enth.challenge/2` round on a patch target (`Target::Patch` with its own start,
# `Start::Patch`), scored by the Recreate scorers; the generator's phrases (held note, legato pair, octave pair) and
# the lesson phrases (the long hold) are both in challenge version 2's table. No generated (seed) target, so no
# `generator`.
[requires]
lesson = 1
challenge = 2
patch = 1
scorers = ["combined/1", "sound/1", "structure/1", "time/1"]
