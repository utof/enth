schema = "enth.lesson/1"
id = "pads"
title = "Pads: Velvet Pad"
tier = "intermediate"
objective = "Take a warm pad apart and rebuild its detune, its slow swell and its hall by ear."
teaches = ["osc.fine", "svf.cutoff", "adsr.attack", "adsr.decay", "adsr.sustain", "adsr.release", "reverb.wet", "reverb.decay"]

