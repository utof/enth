schema = "enth.lesson/1"
id = "percussion"
title = "Percussion: Thump Kick"
tier = "intermediate"
objective = "Take a synth kick apart and rebuild its pitch drop, its click and its short body by ear."
teaches = ["osc.wave", "osc.phase_mode", "osc.phase", "adsr.attack", "adsr.decay", "adsr.sustain", "adsr.release", "osc.semi", "reverb.wet", "reverb.decay"]

