schema = "enth.lesson/1"
id = "leads"
title = "Leads: Breath Flute"
tier = "intermediate"
objective = "Take a flute-like lead apart and rebuild its breath, its swell, its vibrato and its slide by ear."
teaches = ["noise.level", "osc.wave", "svf.cutoff", "svf.resonance", "adsr.attack", "adsr.decay", "adsr.sustain", "adsr.release", "osc.fine", "lfo.rate", "voice.mode", "voice.glide", "voice.glide_mode", "reverb.wet", "reverb.decay"]

