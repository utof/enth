meta = { name = "Pluck, 4 voices", description = "The saw pluck (no sustain, cutoff 3 kHz) with polyphony 4." }
master = { level = -12.0 }
voice = { polyphony = 4.0 }
generators = [
  { id = "osc1", kind = "osc" },
  { id = "osc2", kind = "osc", enabled = false },
