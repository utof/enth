# --- Check: which strikes the second note again (the keys sound on the legato pair, legato against mono: 2.12 JND),
# and which plays two notes of the chord (one, two and four or more voices: 114.0 and about 100 JND from the answer).
# Both follow a round, so they hide what the lesson does not use (LUI's overflow report).
[[steps]]
id = "check-legato"
kind = "choose"
text = "check-legato.md"
hints = ["Listen to the moment the second note comes in: does it strike, or slide on quietly?"]
answer = 1

[steps.view]
