answer = "patch"
phrase = 1

[steps.challenge.target]
kind = "draw"
seed = 2
items = [{ param = "dist1.drive", set = [12.0, 24.0, 36.0] }]

[steps.challenge.start]
kind = "patch"

[steps.challenge.start.patch]
schema = 1
engine = "0.3.0"
meta = { name = "Sine, drive 0 dB", description = "The sine into dist1, soft curve, drive 0 dB." }
master = { level = -12.0 }
generators = [
  { id = "osc1", kind = "osc", params = { wave = "sine" } },
  { id = "osc2", kind = "osc", enabled = false },
