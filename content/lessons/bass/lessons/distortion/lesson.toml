# Do: fold it. Start: the soft curve at 24 dB. Witness: sine fold at 24 dB. A curve is an enum: the hint follower
# cannot move it, so this is a patch goal (the step teaches structure).
[[steps]]
id = "fold"
kind = "do"
text = "fold.md"
hints = ["Open dist1's Mode and pick Sine fold."]
witness = "patches/dist-24db-fold.patch.json"

[steps.view]
layout = "focus"
start = "patches/dist-24db.patch.json"
highlight = ["dist1.mode"]
editable = ["dist1.mode"]
locked = ["osc1.*", "dist1.drive", "dist1.mix"]

[steps.check]
kind = "patch"
predicates = ["dist1.mode == sine_fold"]

# Do: parallel. Start: 24 dB at mix 100 % (757 Hz: fails `brightness < 650Hz`). Witness: mix 40 % (about 533 Hz). The
# patch band keeps it about the mix.
[[steps]]
id = "parallel"
kind = "do"
text = "parallel.md"
hints = [
  "Turn dist1's Mix down: the clean sine comes back under the grit.",
  "About halfway or a little less keeps both.",
]
witness = "patches/dist-24db-mix40.patch.json"

[steps.view]
layout = "focus"
start = "patches/dist-24db.patch.json"
highlight = ["dist1.mix"]
editable = ["dist1.mix"]
locked = ["osc1.*", "dist1.drive", "dist1.mode"]

[steps.check]
kind = "all"

[[steps.check.checks]]
kind = "patch"
predicates = ["dist1.mix in [25%, 60%]"]

[[steps.check.checks]]
kind = "sound"
phrase = 1
expect = ["brightness < 650Hz"]

# Check: soft or folded? (soft against sine fold at 12 dB: 77 JND.)
[[steps]]
id = "check-fold"
kind = "choose"
text = "check-fold.md"
hints = ["A fold throws the sound up into a hollow, ringing tone; soft clipping only roughens it."]
answer = 1

[steps.view]
layout = "focus"

[[steps.options]]
label = "A"
patch = "patches/dist-12db.patch.json"

[[steps.options]]
label = "B"
patch = "patches/dist-sine_fold.patch.json"
