# GR2's test forms (enth.gr2-forms/1; docs/r2-owner.md, "The GR2 files"; content/gr2/README.md says how the codes
# were made and checked). Each family is one Recreate generator category; each form has one long code per family.
# A and B are the parallel pre- and post-test forms (counterbalanced), M the mid-test, D the optional delayed test.
schema = "enth.gr2-forms/1"
# Active seconds an item may take: a pass after it, or any hint, reveal, live meter or dimming, is not a clean pass.
time_limit_s = 180
# Structure % points a family must move, with its pass unchanged, to count as better or worse.
structure_step = 10
# The mid-test comes after this many lessons of the tour track (lesson 0.1 included): after Low-pass cutoff.
mid_after = 5

[[families]]
id = "oscillators"
title = "Oscillators: waveform and pitch"
lessons = ["basics/waveforms"]

[[families]]
id = "sources"
title = "Sources: a second oscillator, noise, glide"
lessons = ["basics/two-oscillators", "basics/noise", "shaping/glide"]

[[families]]
id = "filter"
title = "Filter: mode, cutoff, resonance, drive"
lessons = ["basics/cutoff", "basics/drive"]

[[families]]
id = "envelopes"
title = "Envelopes: the amplitude envelope and an envelope on the cutoff"
lessons = ["basics/decay-and-sustain", "shaping/routes-and-depth"]

[[families]]
id = "modulation"
title = "Modulation: LFOs"
lessons = ["shaping/vibrato"]

[[families]]
id = "effects"
title = "Effects: reverb and compressor"
lessons = ["space-and-dynamics/reverb-space", "space-and-dynamics/compressor-level"]

