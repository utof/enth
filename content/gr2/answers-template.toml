# GR2 answers (enth.gr2-answers/1). Fill this in as you go and send it back with your progress file and your round
# log (gr2-friends.md says where they are). Write only between the quotes; leave anything you skip as "".
# Rename the file to your id before sending (p2.gr2.toml, p3.gr2.toml, ...). No names, e-mail addresses or anything
# private: I will call you by the id.

schema = "enth.gr2-answers/1"
id = "p2"              # your id, from my message
protocol = "tour"      # "full" if you do the tests too (pre-test, mid-test, post-test), else "tour"
pre_form = ""          # full protocol only: the form of your pre-test, "A" or "B" (from my message)

[intake]
years = ""             # years you have made sounds with synths, a number (0 if never)
synths = ""            # which synths, if any (optional)
# How sure you are about each family before you start, 1 (new to me) to 5 (confident); 0 = not answered.
# oscillators: waveform and pitch; sources: a second oscillator, noise, glide; filter: cutoff, resonance, drive;
# envelopes: attack, decay, sustain, release, an envelope on the filter; modulation: LFOs (vibrato, wobble);
# effects: reverb and compressor.
confidence = { oscillators = 0, sources = 0, filter = 0, envelopes = 0, modulation = 0, effects = 0 }

# One block per lesson of the tour, filled right after it:
#   vote    = "new" (new to me) or "knew" (I knew it)
#   pace    = "too_easy", "ok" or "too_hard"
#   learned = what you learned, in one line (optional; a specific thing helps most)
# Leave `coded` alone: I fill it in when I read your notes.

[[lessons]]   # 1. How a lesson works
key = "basics/how-a-lesson-works"
vote = ""
pace = ""
learned = ""
