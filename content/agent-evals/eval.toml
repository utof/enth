# The agent-eval set (docs/agent-cli.md "Evaluating the CLI like a product", docs/p1a-g1.md).
# `eval_version` changes whenever a prompt, a goal's brief, performance or expectation list, a goal's `requires` (the
# judge's structure check, from version 4) or the wrapper's render accounting changes: results from different
# versions are not comparable.
schema = "enth.agent-eval-set/1"
eval_version = 4
changelog = [
  "1 (2026-10-19, P1a lane E): ten goals, three prompts, a 20-render budget counted by the wrapper (a call that fails before rendering gives its slot back).",
  "2 (2026-10-20, P1b lane EV, the G1 eval findings): snare-crack adds tonal_pitch ~ A3 (a tone under noise); filter-wobble asks for filter_lfo and filter_sweep instead of tremolo; the pad_2osc and bass_sub templates are 6 dB quieter (pad_2osc clipped); bass_sub now reads pitch C1 instead of none; the witness self list of filter-wobble uses filter_lfo. Descriptor and CLI output changes: enth.describe/2, check/2, step/2, apply/2, diff/2, params/2.",
  "3 (2026-10-20, R1/S1 lane EV2): 30 goals, from 10 (R1 grows the text set, docs/agent-evals.md). Twenty new goals across the P1 module set and the sound families: basses (bass-sub-sine, bass-808-boom, bass-detuned-fat, bass-acid-squelch), leads (lead-chip-pulse, lead-vibrato, lead-flute-breathy), pads (pad-moving-bright, pad-trance-gate), plucks and keys (pluck-marimba, pluck-hall, keys-organ, keys-tremolo), percussion (hat-open, tom-low, perc-woodblock), FX and textures (fx-noise-riser, fx-reverse-swell, texture-wind, fx-laser-zap). First goals on pitch.stability (vibrato, stillness), tremolo depth, the reverb, the wavetable and a pitch envelope. The ten earlier goals, the prompts and the render accounting are unchanged; only the lead-supersaw witness changed (release 150 to 400 ms, so its duration margin is 10 %, not 4 %). Results from version 2 cover a third of this set and are not comparable.",
  "4 (2026-10-27, S2a lane EV5): 41 goals, from 30. Eleven goals in five S2a families, written for kinds that are still reserved (hidden from `enth modules`; the CLI takes them by key): an FM growl (bass-fm-growl, bass-fm-growl-wobble), a unison reese (bass-reese-unison, bass-reese-moving), tempo-synced wobbles (bass-wobble-eighth, bass-wobble-dotted-mseg), distortion into OTT (bass-fold-sine, bass-dist-ott) and filter and effect chains (bass-formant-talk, pluck-comb-string, bass-chain-ladder-phaser-eq). The format grows by one optional key: goal schema `enth.agent-eval/2` (additive over /1, which still loads) adds `requires`, a check of what the final patch is made of (kinds, routes, parameter values) that the judge applies beside `enth check`, because the descriptors cannot tell an FM growl from a filtered saw or a unison reese from four detuned saws (docs/agent-evals.md lists the imitations that pass the sound lists). A goal with `requires` gets one sentence after its brief in the prompt, saying the check looks at how the patch is built; the prompt files are unchanged. The 30 earlier goals, their witnesses, the prompts as they render for them and the wrapper's render accounting are unchanged, so version 3's numbers for them stay comparable. No paid run has been made on version 4: the model, date and cost are for the owner's OK.",
]
