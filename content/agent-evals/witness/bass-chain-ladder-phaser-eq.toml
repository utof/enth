# Hand-picked solution for the goal of the same name: what `cargo xtask agent-eval --dry-run` replays as its scripted
# fake agent, and the proof that the goal's expectation list (and its structure) is reachable with the current engine.
# SPOILER: this is the answer; the agent under test never sees this directory (it runs in an empty temp dir with only
# an `enth` wrapper). `{perf}` and `{expect}` are filled in from the goal (or from self_expect on the self-written track).
schema = "enth.agent-eval-witness/1"
id = "bass-chain-ladder-phaser-eq"
self_expect = "pitch.note ~ A2, filter_lfo in [0.5Hz, 2Hz], brightness < 1.2kHz, sustain > -8dB, peak < -1dB"

[[step]]
args = ["new", "--template", "init", "--out", "sound.patch.json"]

[[step]]
args = ["step", "sound.patch.json", "--ops", '[{"add":"ladder","at":"voice_fx[0]","params":{"cutoff":"2500Hz","resonance":"20%"}},{"add":"phaser","at":"fx[0]","params":{"stages":"4","rate":"0.9Hz","depth":"100%","center":"600Hz","feedback":"40%"}},{"add":"eq","at":"fx[1]","params":{"high_cut":"3000Hz","low_gain":"4dB"}},{"set":"env1.sustain","to":"100%"},{"set":"master.level","to":"-3dB"}]', "--perf", "{perf}", "--expect", "{expect}"]
