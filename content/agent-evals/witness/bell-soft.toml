# Hand-picked solution for the goal of the same name: what `cargo xtask agent-eval --dry-run` replays as its scripted
# fake agent, and the proof that the goal's expectation list is reachable with the current engine. SPOILER: this is
# the answer; the agent under test never sees this directory (it runs in an empty temp dir with only an `enth`
# wrapper). `{perf}` and `{expect}` are filled in from the goal (or from self_expect on the self-written track).
schema = "enth.agent-eval-witness/1"
id = "bell-soft"
self_expect = "pitch.note ~ C5, attack < 40ms, decay > 600ms, sustain < -30dB, duration > 2000ms, beating in [1Hz, 10Hz]"

[[step]]
args = ["new", "--template", "init", "--out", "sound.patch.json"]

[[step]]
args = ["step", "sound.patch.json", "--ops", '[{"add":"osc","id":"osc2","params":{"wave":"saw","fine":"14ct"}},{"add":"svf","at":"voice_fx[0]","params":{"mode":"lp","cutoff":"1.8kHz"}},{"set":"env1.attack","to":"15ms"},{"set":"env1.decay","to":"6s"},{"set":"env1.sustain","to":"0%"},{"set":"env1.release","to":"300ms"},{"set":"master.level","to":"-9dB"}]', "--perf", "{perf}", "--expect", "{expect}"]
