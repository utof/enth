steps = ["hear-loud:listen", "hear-matched:listen", "name:read", "try:do", "round:recreate", "check-different:choose"]
rationale = "How a lesson works of the basics pack: 6 steps (1 do, 1 recreate, 1 choose, 2 listen, 1 read). The objective, in the pack's words: Play a lesson's steps and a round, and judge sounds at matched loudness rather than by volume. A do step is judged by `enth lesson check`, a round by `enth compare --challenge` (the pass mark of the round), an ear question by its recorded answer; a patch that changes a control the step locks does not count."
