schema = "enth.agent-eval/2"
id = "bass-reese-moving"
added = "2026-10-27"
difficulty = 5
tags = ["unison-reese", "bass", "reese", "unison", "detune", "wt", "sweep", "filter", "lfo", "s2a"]
brief = "a reese bass that breathes: unison copies of one oscillator, detuned, with the low-pass filter swept slowly open and shut"
template = "init"
expect = "tonal_pitch ~ E1, filter_lfo in [0.9Hz, 1.6Hz], filter_sweep > 1.5oct, brightness in [250Hz, 700Hz], noisiness > 0.04, beating == null, sustain > -12dB, peak < -1dB"
requires = ["wt.unison >= 3", "lfo -> svf.cutoff"]
rationale = "The reese from bass-reese-unison with the filter swept slowly: an LFO at 1.2 Hz on the low-pass cutoff (`lfo -> svf.cutoff`, +2 octaves), the unison stack under it. The sweep reads robustly (1.202 Hz, window 0.9 Hz to 1.6 Hz; 3.0 octaves, over 1.5), the centroid stays dark (367 Hz, 250 Hz to 700 Hz), the stack still has no single beat rate and a noise ratio of 0.11 (over 0.04), and the sustain is -6.2 dB (over -12). The note is held 5 s so six sweep cycles are measured. Four detuned old oscillators with the same filter and LFO pass the sound list (negative control), so `requires` asks for `wt.unison >= 3` and the LFO on the filter cutoff. The blank template fails 4 of 8 items."
engine_min = "0.3.0"
perf = { notes = [{ note = "E1", vel = 100, on_s = 0.0, off_s = 5.0 }], dur_s = 6.0 }
budget = { renders = 20, turns = 60, usd = 1.0 }
