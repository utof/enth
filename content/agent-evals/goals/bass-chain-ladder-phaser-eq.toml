schema = "enth.agent-eval/2"
id = "bass-chain-ladder-phaser-eq"
added = "2026-10-27"
difficulty = 5
tags = ["chain", "bass", "ladder", "phaser", "eq", "filter", "effects", "s2a"]
brief = "a dark swirling bass through a chain of a resonant ladder low-pass, a slow phaser and an equaliser that rolls off the top"
template = "init"
expect = "pitch.note ~ A2, filter_lfo in [0.7Hz, 1.2Hz], filter_sweep > 0.3oct, brightness in [450Hz, 900Hz], noisiness < 0.05, sustain > -6dB, peak < -1dB"
requires = ["ladder", "phaser", "eq"]
rationale = "A chain of three filters and effects: a resonant ladder low-pass on the voice (2.5 kHz, resonance 20 %), a phaser on the mix (4 stages, 0.9 Hz, depth 100 %, centre 600 Hz, feedback 40 %) and an equaliser after it (high cut at 3 kHz, +4 dB low shelf). The phaser's notches move across the spectrum at its rate, which the list reads as a slow centroid swing (0.902 Hz for a rate of 0.9, window 0.7 Hz to 1.2 Hz; 0.67 octaves, over 0.3). The centroid sits at 647 Hz (450 Hz to 900 Hz), the noise ratio under 0.05 (2e-4) and the level at -1.5 dB (over -6); the master is at -3 dB, leaving 9.7 dB under the peak limit. A low-pass swept by a 0.9 Hz LFO passes the sound list (negative control), so `requires` asks for `ladder`, `phaser` and `eq`. The hardest of the set: three kinds to discover, none of them in `enth modules`. The blank template fails 3 of 7 items."
engine_min = "0.3.0"
perf = { notes = [{ note = "A2", vel = 100, on_s = 0.0, off_s = 4.0 }], dur_s = 5.0 }
budget = { renders = 20, turns = 60, usd = 1.0 }
