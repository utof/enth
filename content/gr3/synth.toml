# content/gr3/synth.toml: GR3 clause 1's held-out synth targets (lane DS, R3, freeze F0s).
# docs/r3.md "GR3 and its hygiene"; content/gr3/README.md says how to read and check this file.
# Targets are specs (a generator-v1 code, or a patch file) plus a performance, never audio: renders are bit-exact.
# Frozen: never edit an entry. A change is a new set version beside this one (README, "The freeze").

schema = "enth.gr3-synth/1"
set_version = 1
frozen_on = "2026-10-21"
frozen_at_commit = "eb2fb6d"  # the main commit the set was drawn from

[sizes]
test_generator = 92  # levels 1-5: 12, 20, 20, 20, 20 (level 1 has only 14 distinct targets; see [generator])
test_hand_made = 22  # 11 test-half presets x 2 notes
test_owner_g1 = 8  # placeholders: the owner's 4 G1 sounds x 2 notes, once extracted
test_total = 122  # 114 until the G1 sounds exist
test_core = 40  # the pre-declared 40-target core: the 300 s tail, and the degraded core
dev = 30  # 20 generator + 10 renders of 5 anchor-half presets; all tuning happens here

[generator]
version = 1  # generator v1 is frozen: a spec gives the same fingerprint on every build (its golden pins it)
presets = "code v1's level presets 1-5 (difficulty 0, 25, 50, 75, 100; musical 100; template 0); short codes"
block = [770000000000, 770999999999]  # GR3's seed block; below 2^40, so codes stay short. Training never draws a seed here
test_seed = "770000000000 + 10000 * level + k"  # k = 1, 2, ...; a separate seed per level, because keyed streams share draws across levels
dev_seed = "770000500000 + 10000 * level + k"
selection = """For each split (test, then dev) and level 1..5, try k = 1, 2, ... in order and accept the seed unless:
(1) enth refuses the round (silent target); (2) its target fingerprint equals an accepted target's, GR1's or a golden
challenge's; (3) it is within one minimum step (docs/challenge.md, "The minimum step") of an accepted target of the same
level in both splits: same phrase, same enabled modules, same routes with depths under 5 points apart, and every
randomized value within its step (frequencies 2 semitones, LFO rates and times x1.5 with 1 ms added, level percentages
and dB 3 dB, semitones 1, cents 3, other percentages 10 points, discrete values equal). Stop at the level's count,
or after k = 500 (only dev level 1 stopped there: 2 of 4). No other filter: nothing was rendered, scored or listened to."""
tool = "enth challenge new --level L --seed S; enth challenge show CODE --reveal (a build of main with generator v1)"
recheck = "python3 content/gr3/check.py --enth <path to an enth build> re-derives every code and fingerprint"

[generator.skipped]  # seeds tried and skipped, per split and level (all inside the block, so excluded anyway)
dev_l1 = { same_fingerprint = 308, near_duplicate = 190, silent = 0, last_seed_tried = 770000510500 }
dev_l2 = { same_fingerprint = 0, near_duplicate = 1, silent = 0, last_seed_tried = 770000520005 }
test_l1 = { same_fingerprint = 20, near_duplicate = 7, silent = 0, last_seed_tried = 770000010039 }
test_l2 = { same_fingerprint = 0, near_duplicate = 1, silent = 0, last_seed_tried = 770000020021 }

[preset_split]
rule = "Sort the 22 files of content/presets-candidates/ by folder name, then by SHA-256 of \"gr3/preset-split/v1:<file stem>\" (hex); even positions (0-based) are the test half, odd positions the anchor half."
order = ["octave-arp", "wobble-machine", "acid-snap", "warm-reese", "sub-floor", "noise-riser", "drawbar-organ", "soft-bell", "tremolo-keys", "solar-lead", "breath-flute", "pixel-square", "sync-tear", "velvet-pad", "gate-keeper", "night-drift", "aurora", "thump-kick", "snare-crack", "glass-pluck", "poly-stab", "wind-tunnel"]
test = ["octave-arp", "acid-snap", "sub-floor", "drawbar-organ", "tremolo-keys", "breath-flute", "sync-tear", "gate-keeper", "aurora", "snare-crack", "poly-stab"]
anchor = ["wobble-machine", "warm-reese", "noise-riser", "soft-bell", "solar-lead", "pixel-square", "velvet-pad", "night-drift", "thump-kick", "glass-pluck", "wind-tunnel"]
dev_from_anchor = ["wobble-machine", "noise-riser", "solar-lead", "velvet-pad", "thump-kick"]  # split positions 1, 5, 9, 13, 17
statement = """The test half is never a perturbation anchor for ds1, never fitted as a prior, never a template, start or
k-NN bank entry, and never tuned on; training may use only the anchor half (r3.md: 25 % perturbed preset candidates,
from the anchor half only). The test presets are frozen as byte copies in content/gr3/presets/ (their SHA-256 equals
the candidate files at the freeze commit), so a later retune of a candidate never moves a GR3 target. If the owner
promotes a test-half candidate to a factory preset (content/presets/), it stays a GR3 target and stays out of every
bank, template and prior: exclude-synth.txt lists the file hashes and stems."""
performance = "a: the note, hold and clip of the candidates README (velocity 100); b: 7 semitones up, velocity 80, same hold and clip. Owner G1 sounds use their type's row (bass C2 2/3 s, pad C3 5/8 s, pluck C4 1/2.5 s, lead C4 1.5/3 s)."

[[stream]]
key = "r3/test"
sampler = "ds1"  # lane DG; the version is ds1's first released one, recorded with it
size = 2000
use = "development curves (report 02 set A); never trained on; deduped against training within about one just-noticeable step; never a GR3 gate"

# ----- targets: test first (generator, hand-made, owner G1), then dev ---------------------------------------------

