# content/gr3/real.toml: GR3 clause 2's references (lane DS, R3, freeze F0s).
# docs/r3.md "GR3 and its hygiene"; content/gr3/README.md. Manifest only: no audio is committed.
# 60 references = 40 clean (10 per stratum below) + 20 degraded copies of 20 of them (degraded.toml, judged
# against the clean original). Licences were read on each sound's own page on the date given.

schema = "enth.gr3-real/1"
set_version = 1
frozen_on = "2026-10-21"

[sizes]
clean = 40  # sub 10, fm 10, ac 10, owner 10
degraded = 20  # 5 per stratum; degraded.toml
references = 60
defaults = 10  # agent picks that fill the owner slots the owner leaves empty
reserves = 8  # 2 per stratum, used only to replace an item whose source disappears before the first test run

[rules]
selection = "Picked by an agent (lane DS) from Freesound search results and sound pages, by stratum, title, description and tags only: nothing was played, auditioned or run through enth. At most 2 sounds per uploader and 1 per Freesound pack. Skipped: sounds whose page says they were ripped from a record, a video or a commercial pack; sounds that are themselves FSD50K clips (FSD50K v1.0 ground truth, Zenodo 4060432), so the set is disjoint from FSD50K by construction."
licences = "CC0 or CC BY only, read from the sound's page (the licence link beside the player). All 48 are CC0 (Creative Commons 0, publicdomain/zero/1.0) as read on 2026-10-21. CC0 needs no attribution; the attribution field is a courtesy credit."
audio = "The reference is the Freesound HQ Ogg preview (Vorbis, about 192 kbps stereo or 110 kbps mono, at the original sample rate): public, no account, and hashed below. The original files need a Freesound account (the owner's); fetching them is optional and never replaces a preview after the freeze (a new set version would)."
local_root = "~/code/enth-scratch/r3-data/freesound/"  # where the previews live; never committed (CC0 would allow it; the coordinator keeps audio out of git)
owner_slots = "owner-01..owner-10: the owner's own picks, as local files ~/code/enth-scratch/owner/r3-picks/owner-NN.<ext> (any format enth reads), never committed unless CC0 or the owner's. A slot left empty at the amendment (README) is filled by owner-default-NN. The owner records licence, source and SHA-256 in the amendment."
dedupe = "exclude-real.txt lists every Freesound id, pack, uploader (advisory) and audio SHA-256 here, test, default and reserve alike; training drops them from FSD50K, Freesound and any other source."

