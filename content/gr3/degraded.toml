# content/gr3/degraded.toml: GR3's degraded items (lane DS, R3, freeze F0s), made by lane DEG's held-out chain.
# docs/r3.md "GR3 and its hygiene"; content/gr3/README.md. Every degraded item is judged against its CLEAN source:
# the synth items by sound/1 against the clean target patch, the real items in the listening test against the
# clean original. An item is pinned by (source, pool heldout, profile, seed); plan_sha256 pins the drawn parameters.

schema = "enth.gr3-degraded/1"
set_version = 1
frozen_on = "2026-10-21"

[chain]
tool = "ml/enth_ml/degrade (lane DEG): python -m enth_ml.degrade --in <clean> --out <degraded> --seed <seed> --pool heldout --profile <profile> --record <json>"
commit = "4cd21c1"  # branch r3/deg; pools.toml is unchanged since 3837863
pools_toml = "ml/enth_ml/degrade/pools.toml"
pools_sha256 = "da671fcb967cd795823427e57278e49c81fbc7f5db5de9581ccbef8950630353"
pool = "heldout"  # evaluation only; disjoint from the train pool by construction (DEG's test)
plan_sha256 = "SHA-256 of json.dumps(enth_ml.degrade.chain.make_plan(pools, \"heldout\", seed, profile), sort_keys=True, separators=(\",\", \":\")) encoded as UTF-8"
audio_bytes = "Parameters are exact on every machine (DEG's SplitMix64 streams); output bytes also depend on the ffmpeg build and CPU, so every degraded file's record names its ffmpeg and both input and output SHA-256 go into runs.jsonl."
synth_input = "the clean render of the target: its phrase (generator) or perf (hand-made), 48 kHz, SCORING_SEED, as EVK renders it"
real_input = "the reference's audio file in real.toml (the HQ Ogg preview; for an owner slot, the owner's file or its default)"

[sizes]
synth = 488  # every clean test target x 4 held-out profiles; 456 until the G1 sounds exist
synth_core = 160  # the 40 core targets x 4: run first when machine time is short
real = 20  # 5 per stratum x the 5 upload chains

[rules]
synth = "Every test target in synth.toml, in its order (t = 1, 2, ...), through the profiles mp3, noise-hum, reverb and clip-limit (p = 1..4): report 04 section 2's four degradations, held out."
synth_seed = "770100000000 + 10 * t + p"
real = "Per stratum (sub, fm, ac, owner), the 5 test references with the smallest SHA-256 of \"gr3/real-degraded/v1:<id>\" take, in that order, the chains mp3, upload-noisy, upload-room, upload-loud, phone-recording."
real_seed = "770200000000 + k, k = 1..20 in the order listed"
phone = "phone-recording is the default stand-in for the owner's phone re-recordings (owner sheet: optional, about 30 min). Re-recordings, if made, are a new set version, never a swap."

[profiles]  # lane DEG's held-out profiles (pools.toml), as used here
mp3 = "codec: libshine CBR 32-96 kbps, or LAME VBR V5-V9 or ABR 32-96 kbps (training has only LAME CBR, native AAC two-loop and Opus audio)"
noise-hum = "noise: blue, violet or velvet noise, or amplitude-modulated band-limited pink babble, at 5-20 dB SNR (training: white, pink, brown at 15-50 dB); plus a 50/60 Hz buzz of 6-12 flat harmonics at 15-29 dB SNR (training hum: 2-4 harmonics at 30-60 dB)"
reverb = "room: synthetic living-room RT60 0.4-0.6 s, hall 1.1-1.4 s, cathedral 2.0-2.5 s, or a flutter echo 0.8-1.6 s (training rooms: 0.15-0.35, 0.7-1.0, 1.5-1.9 s, no flutter)"
clip-limit = "dynamics: hard clip or limiter at +13 to +18 dB, atan or cubic soft clip at +6 to +18 dB (training: hard, tanh, limiter at +3 to +12 dB)"
upload-noisy = "noise + hum + the mp3 codecs"
upload-room = "room (any held-out room) + the mp3 codecs"
upload-loud = "dynamics (as clip-limit) + the mp3 codecs"
phone-recording = "living-room + phone-speaker EQ (high-pass 420-800 Hz, low-pass 2.4-3 kHz, one 4-9 dB peak) + mono (plain or partly cancelling downmix) + AMR-NB 4.75-12.2 kbps or GSM 06.10 at 8 kHz"

