# The data manifest (lane AUG, R3b): every audio source augmentation or training may touch, its licence as read at the
# source, and the use it is allowed. Reference: ml/README.md ("AUG"); the rules are checked by
# ml/tests/test_augment_manifest.py and by enth_ml.augment.manifest.check_manifest.
#
# THE RULE (docs/phase-3.md "ML rules", docs/r3.md "Augmentation and licences"): shipped weights train only on our own
# renders plus CC0, CC BY or Apache data. CC BY-NC, CC BY-SA, ND, Sampling+ and licence-less or unverified sets are
# evaluation-only and stay local. A source's licence is READ FROM THE SOURCE (a page, a licence file inside the archive, a
# distribution's copyright file) and recorded here with the date; nothing is assumed from a dataset's name.
#
# `use`:
#   shipped-training  shipped weights may train on it (the licence must be CC0, CC BY or Apache; `check_manifest`
#                     refuses NC, SA, ND, Sampling+, unknown or missing licences marked this way)
#   research-only     evaluation and local experiments only (NC, SA, licence-less, unverified terms, held-out collections)
#   excluded          not used at all (unavailable, or unusable)
# A part (a folder of an archive) may tighten its source's `use`, never loosen it. `role = "heldout-eval"` collections
# (GR3's held-out rooms and noises) can never be shipped-training, and no augmentation config may reference them.
#
# Nothing here is downloaded by tests or by importing the package. Archives were fetched by hand into `local_root`
# (outside the repository, never committed); `ml/data/fetch.py` fetches the rest, checking robots.txt first, with the
# User-Agent `enth-research/0.1`. `fetched = false` entries have no hash yet: the script writes it on the first fetch and
# the next commit records it.

schema = "enth.data-manifest/1"
version = 1
updated = "2026-10-22"
local_root = "~/code/enth-scratch/r3-data/aug"

[policy]
shipped_licences = ["CC0-1.0", "CC-BY-3.0", "CC-BY-4.0", "Apache-2.0"]

# ====================================================================================================================
# Sources augmentation draws from (shipped-training)
# ====================================================================================================================

