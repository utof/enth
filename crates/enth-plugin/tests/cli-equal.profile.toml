# The engine golden cases `enth-test-host cli-equal` renders through enth-plugin (docs/plugin.md): every case. Since
# lane PL, `mod-controls` is in too: the test host plays a case's `controls` (macros as the host parameters
# "Macro N", the mod wheel as MIDI CC 1) and the plugin takes MIDI CCs (`MidiConfig::MidiCCs`).
# The cases the test host skips itself (seeds other than the default, the stand-in sine, engine-address automation)
