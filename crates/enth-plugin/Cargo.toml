[package]
name = "enth-plugin"
description = "L8: the CLAP and VST3 plugin shell (nice-plug): host parameters, notes, audio, state and the editor window around enth-ui; it translates and holds no product rules"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib is the plugin; lib lets `cargo test` and other crates link the same code.
crate-type = ["cdylib", "lib"]

[dependencies]
# Pre-declared by lane S0b (P1b) so Cargo.lock is resolved before the lanes fan out; lanes use what they need.
enth-session.workspace = true
enth-ui.workspace = true
enth-engine.workspace = true
enth-render.workspace = true
enth-patch.workspace = true
enth-params.workspace = true
# Pre-declared by lane S0r (R1/S1): game wiring, the target render and scoring on a worker (SKR), hints (SN).
enth-challenge.workspace = true
enth-solver.workspace = true
# Pre-declared by lane S0l (R2): pack I/O, the progress file and Learn jobs on the game worker (lane SKL). The crate is a
# core crate and always compiles; the plugin's own `learn` feature gates the I/O and the bundled content.
enth-learn.workspace = true
# Added by the coordinator (2026-10-21) for a parallel hint evaluator: `enth-analysis`'s `Descriptors` per worker.
enth-analysis.workspace = true
# Exact pins in the root Cargo.toml (docs/adr/0001-plugin-shell.md). `assert_process_allocs` only has an effect in debug
# builds: nice-plug gates it on debug_assertions, and the validator's process() calls abort on any allocation.
nice-plug = { workspace = true, features = ["vst3", "editor", "assert_process_allocs"] }
nice-plug-egui.workspace = true
# No `default_fonts`: Theme::apply installs Inter and nothing else (enth-ui assets/fonts).
egui.workspace = true
parking_lot.workspace = true
serde.workspace = true
# `raw_value`: the `patch` field carries `Patch::to_json()` verbatim (docs/session.md); no extra crates.
serde_json = { workspace = true, features = ["raw_value"] }

[features]
# A timing histogram of `process()` inside the plugin (src/rt_stats.rs, docs/plugin.md "rt-stats"): off by default;
# without it `process()` reads no clock and the module is not compiled.
rt-stats = []
# Editor lifecycle counters for the leak gate (src/editor_counts.rs, `cargo xtask leak-test`): off by default; with it
# the plugin counts `build()` and `editor_closed()` and appends them to the file `$ENTH_EDITOR_COUNTS` names.
editor-counts = []
# R1/S1 (lane S0r): forward enth-ui's header hook features, so a build can turn a hook on from the plugin. No behaviour
# until lanes RUI, PBU and AM fill their hooks; off by default.
# Lane SKR (F2r): `recreate` is on by default, so the plugin's editor shows the minimal Recreate bar (Start, Target ▶,
# Mine ▶, Submit, Reveal, End and a score readout) a round is played with; lane RUI builds the real one. The round's
# worker, A/B and round log are compiled either way (a saved round restores in any build).
recreate = ["enth-ui/recreate"]
presets = ["enth-ui/presets"]
add-module = ["enth-ui/add-module"]
# R2 (lane S0l): the Learn I/O (src/learn.rs, lane SKL: pack I/O, the progress file, Learn jobs on the worker) and the
# editor's Learn view (enth-ui/learn). Off by default until lane SKL (F2l) decides; `enth-learn` and the session's
# `learn` always compile, so a saved lesson restores in any build.
learn = ["enth-ui/learn"]
default = ["recreate"]
# Lane SKR: the `process-stats --ab` measurement harness (src/game.rs, `harness`): with `ENTH_AB_TOGGLE_MS` set,
# activation starts a round and `process()` flips Target ▶ and Mine ▶ itself every that many ms of audio. Off by
# default; for measurement bundles only (docs/plugin.md, "The Recreate round").
ab-toggle = []

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true
