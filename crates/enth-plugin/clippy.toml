  { path = "f64::algebraic_rem", reason = "allows reassociation and contraction: hashes differ between platforms and build flags" },
  # wide's fused operations (`wide` joins enth-dsp/enth-engine later; the vector types are not otherwise banned).
  { path = "wide::f32x4::mul_add", reason = "fused on x86 with FMA and on aarch64, unfused elsewhere: hashes differ with -C target-cpu=native" },
  { path = "wide::f32x4::mul_sub", reason = "fused on x86 with FMA and on aarch64, unfused elsewhere: hashes differ with -C target-cpu=native" },
  { path = "wide::f32x4::mul_neg_add", reason = "fused on x86 with FMA and on aarch64, unfused elsewhere: hashes differ with -C target-cpu=native" },
  { path = "wide::f32x4::mul_neg_sub", reason = "fused on x86 with FMA and on aarch64, unfused elsewhere: hashes differ with -C target-cpu=native" },
  { path = "wide::f32x8::mul_add", reason = "fused on x86 with FMA and on aarch64, unfused elsewhere: hashes differ with -C target-cpu=native" },
  { path = "wide::f32x8::mul_sub", reason = "fused on x86 with FMA and on aarch64, unfused elsewhere: hashes differ with -C target-cpu=native" },
  { path = "wide::f32x8::mul_neg_add", reason = "fused on x86 with FMA and on aarch64, unfused elsewhere: hashes differ with -C target-cpu=native" },
  { path = "wide::f32x8::mul_neg_sub", reason = "fused on x86 with FMA and on aarch64, unfused elsewhere: hashes differ with -C target-cpu=native" },

  # --- Real time (docs/architecture.md, rule 3): no channels in core crates ---
  # std's mpsc allocates a block as senders outrun the receiver and blocks in recv; sync_channel blocks in send. Use
  # an `rtrb` ring. Core crates spawn no threads, so they have no use for channels; shells opt out at the crate root.
  { path = "std::sync::mpsc::channel", reason = "unbounded: it allocates on send and has no overflow policy; use an `rtrb` ring (enth-engine rule)" },
  { path = "std::sync::mpsc::sync_channel", reason = "blocks in send and allocates; use an `rtrb` ring with an overflow policy" },
  { path = "crossbeam_channel::unbounded", reason = "unbounded: it allocates on send; use an `rtrb` ring" },
  { path = "crossbeam::channel::unbounded", reason = "unbounded: it allocates on send; use an `rtrb` ring" },
  { path = "flume::unbounded", reason = "unbounded: it allocates on send; use an `rtrb` ring" },
]
disallowed-types = [
  { path = "std::sync::Mutex", reason = "no locks in core crates; the audio path is lock-free" },
  { path = "std::sync::RwLock", reason = "no locks in core crates; the audio path is lock-free" },
  { path = "std::collections::HashMap", reason = "RandomState iteration order changes per process; use BTreeMap or Vec for deterministic output" },
  { path = "std::collections::HashSet", reason = "RandomState iteration order changes per process; use BTreeSet" },
  { path = "std::sync::mpsc::Sender", reason = "unbounded channel: allocates on send; use an `rtrb` ring" },
  { path = "std::sync::mpsc::SyncSender", reason = "blocks in send; use an `rtrb` ring" },
  { path = "std::sync::mpsc::Receiver", reason = "blocks in recv; use an `rtrb` ring" },
]
