# enth-plugin's clippy options. A crate-level clippy.toml *replaces* the root one, so this file repeats the
# workspace's lists (copied from the root clippy.toml; keep them in sync) and adds the plugin shell's own bans
# (AGENTS.md, "Plugin shell"). The shell may do I/O, own threads and lock (it is L8), so instead of a crate-wide
# `allow(clippy::disallowed_methods)` (which would switch the nice-plug bans off too) the I/O, clock and thread
# entries are left out below; the determinism, channel and lock bans stay.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
disallowed-methods = [
  # --- The plugin shell (AGENTS.md, docs/session.md, docs/plugin.md) ---
  { path = "nice_plug_core::context::gui::GuiContext::set_state", reason = "while the plugin processes, nice-plug loads that state on the audio thread, where the patch field would lock the session and compile: load patches with Session::load_patch on the GUI thread" },
  { path = "nice_plug_core::context::gui::GuiContext::get_state", reason = "serialises the fields, which lock the session: deadlocks inside an editor frame" },
  { path = "nice_plug_core::context::gui::AsyncExecutor::execute_gui", reason = "may run the task inline inside process() (CLAP request_callback on the main thread): use execute_background" },
  { path = "nice_plug_core::context::process::ProcessContext::execute_gui", reason = "may run the task inline inside process(): use execute_background (Task::Pump)" },
  { path = "nice_plug_core::midi::VoiceID::id_or_fallback", reason = "ignores the host's voice id: read VoiceID::id()" },
  # --- Bit-exact renders on every platform (docs/design.md section 5; moved here from spikes/spike-engine) ---
  # Transcendentals only through the pinned `libm` crate (or our own approximations built from + - * / sqrt),
  # no fused multiply-add, no algebraic_* (reassociation allowed). sqrt, floor, round, abs and the like are exact in
  # IEEE 754 and stay allowed. f32 and f64 are listed alike.
  { path = "f32::sin", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::cos", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::tan", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::sin_cos", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::asin", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::acos", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::atan", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::atan2", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::sinh", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::cosh", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::tanh", reason = "use `libm::tanh`/`tanhf` or the `tanh_approx` in enth_dsp::util::math" },
  { path = "f32::asinh", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::acosh", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::atanh", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::exp", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::exp2", reason = "LLVM rewrites powf(2, x) into exp2, so it is not portable either: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::exp_m1", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::ln", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::ln_1p", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::log", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::log2", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::log10", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::powf", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::cbrt", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::hypot", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f32::powi", reason = "compiler-rt `__powisf2` and LLVM's expansion are not specified: multiply explicitly or use `libm`" },
  { path = "f32::mul_add", reason = "fused only where the target has FMA (or through libm's software fma): hashes differ between platforms and build flags" },
  { path = "f32::algebraic_add", reason = "allows reassociation and contraction: hashes differ between platforms and build flags" },
  { path = "f32::algebraic_sub", reason = "allows reassociation and contraction: hashes differ between platforms and build flags" },
