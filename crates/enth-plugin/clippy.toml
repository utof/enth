  { path = "f32::algebraic_div", reason = "allows reassociation and contraction: hashes differ between platforms and build flags" },
  { path = "f32::algebraic_rem", reason = "allows reassociation and contraction: hashes differ between platforms and build flags" },
  { path = "f64::sin", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::cos", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::tan", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::sin_cos", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::asin", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::acos", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::atan", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::atan2", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::sinh", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::cosh", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::tanh", reason = "use `libm::tanh`/`tanhf` or the `tanh_approx` in enth_dsp::util::math" },
  { path = "f64::asinh", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::acosh", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::atanh", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::exp", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::exp2", reason = "LLVM rewrites powf(2, x) into exp2, so it is not portable either: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::exp_m1", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::ln", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::ln_1p", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::log", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::log2", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::log10", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::powf", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::cbrt", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::hypot", reason = "std maths differs between libm, glibc, musl and wasm: use the pinned `libm` crate (enth_dsp::util::math)" },
  { path = "f64::powi", reason = "compiler-rt `__powisf2` and LLVM's expansion are not specified: multiply explicitly or use `libm`" },
