[package]
name = "enth-cli"
description = "L8: the `enth` binary for humans, scripts and agents; a thin shell over enth_cli::run (docs/agent-cli.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "enth_cli"

[[bin]]
name = "enth"
path = "src/main.rs"

[dependencies]
# Pre-declared by lane S0 so Cargo.lock is resolved before the lanes fan out (L8 may use L0-L5).
enth-params.workspace = true
enth-patch.workspace = true
enth-render.workspace = true
enth-analysis.workspace = true
enth-solver.workspace = true
# Pre-declared by lane S0r (R1/S1): `compare`, `suggest`, `match`, `explain` and `challenge` (lanes SKR and CL).
enth-challenge.workspace = true
# Pre-declared by lane S0l (R2): `enth lesson list|show|check|hint|closest` (lanes SKL and EV3). The CLI reads packs in the
# authoring layout (TOML), so it turns the crate's `toml` feature on; the plugin does not.
enth-learn = { workspace = true, features = ["toml"] }
# Pre-declared by lane S0e (R4/R5): `enth ear` plays and answers ear games (lanes SKE and EV4), with `enth-music`'s labels;
# `enth duel result|verify` (lane SKD) needs only `enth-challenge`, which is already here.
enth-music.workspace = true
# Pre-declared by lane S0s (R3): `enth create` decodes FLAC, Ogg Vorbis and MP3 beside WAV (`hound`, below) and hands the
# search to the rayon-backed evaluator (lanes SK3 and CLC). `symphonia` (MPL-2.0) is not here: it waits for the owner's OK.
claxon.workspace = true
lewton.workspace = true
nanomp3.workspace = true
clap.workspace = true
schemars.workspace = true
strsim.workspace = true
hound.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
insta.workspace = true
insta-cmd.workspace = true

[lints]
workspace = true
