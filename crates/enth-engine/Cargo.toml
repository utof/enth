[package]
name = "enth-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Pre-declared by lane S0 so Cargo.lock is resolved before the lanes fan out; lanes use what they need.
enth-dsp.workspace = true
enth-params.workspace = true
enth-patch.workspace = true
libm.workspace = true
rtrb.workspace = true

[dev-dependencies]
proptest.workspace = true
assert_no_alloc.workspace = true

# gungraun (callgrind) does not build for wasm, and `cargo test --target wasm32-wasip1` builds dev-dependencies.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
gungraun.workspace = true

# One gungraun bench file per module kind, declared up front by lane S0 so that enth-engine/Cargo.toml is not a merge
# hotspot: each module lane replaces the placeholder in its own file and sets its own instruction budget, using the
# render helpers in benches/common/mod.rs (lane S2a).
# Run: cargo xtask bench (needs valgrind and a gungraun-runner of the same version as the gungraun crate).
[[bench]]
name = "engine"  # lane S2a: the skeleton (segment loop, FIFO, voice sum) with the reference saw; shared helpers in benches/common
harness = false

[[bench]]
name = "osc"  # lane D1 (one `osc` kind: classic waves and the wavetable mode; S2a merged the analog and wavetable stubs)
harness = false

[[bench]]
name = "noise"  # lane D1
harness = false

[[bench]]
name = "svf"  # lane D2
harness = false

[[bench]]
name = "adsr"  # lane D2
harness = false

[[bench]]
name = "lfo"  # lane D2
harness = false

[[bench]]
name = "reverb"  # lane FX1
harness = false

[[bench]]
name = "comp"  # lane FX2
harness = false

[[bench]]
name = "g1"  # spine (S2b/E): the 16-voice reference patch, G1 budget
harness = false

[[bench]]
name = "swap"  # P1b lane RT: the plan swap's spiky blocks on the G1 patch (instant swap, crossfading swap, crossfade)
harness = false

[lints]
workspace = true
