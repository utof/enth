[package]
name = "enth-session"
description = "L6: the single-threaded Session that owns the Patch, History, engine Link and PlanMap; the editor and the plugin shell edit through it (docs/architecture.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Pre-declared by lane S0b (P1b) so Cargo.lock is resolved before the lanes fan out; lanes use what they need.
# The session stays pure: no locks, threads, clocks or I/O (the root clippy.toml bans apply), so a standalone or wasm
# shell can reuse it. The plugin adds the Mutex.
enth-params.workspace = true
enth-patch.workspace = true
enth-engine.workspace = true
enth-render.workspace = true     # DEFAULT_SEED only: the render seed is never per instance and never the patch hash
# Pre-declared by lane S0r (R1/S1): the pure `game` module drives a round over a Challenge (lane SG).
enth-challenge.workspace = true
# Pre-declared by lane S0l (R2): the pure `learn` module binds the lesson player to the live patch (lane SL).
enth-learn.workspace = true
# Pre-declared by lane S0s (R3): the pure `create` module holds the create jobs' read model, the K candidates of
# `enth_solver::create` and the intake's report from `enth_analysis::intake` (lane SK3). L6 may use L3 and L5.
enth-analysis.workspace = true
enth-solver.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
proptest.workspace = true
insta.workspace = true
assert_no_alloc.workspace = true

[lints]
workspace = true
