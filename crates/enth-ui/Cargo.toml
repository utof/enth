[package]
name = "enth-ui"
description = "The editor's design system: theme tokens (docs/design-system.md) and the widgets built only from them"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# Inter (OFL-1.1) is bundled under assets/fonts with its licence; see THIRD_PARTY_NOTICES.md.

[features]
# The standalone editor dev window (`examples/dev_window.rs`, lane ED1): it opens a real window, so it runs on the owner's
# display or under Xvfb only (AGENTS.md). Off by default, so eframe stays out of the plugin and the gate builds.
dev-window = ["dep:eframe"]
# Reserved regions for Learn (the lesson pane) and Recreate (the challenge bar and the results drawer), placed by a layout
# (docs/editor.md). P1b builds no presenters for them: a reserved region draws an empty panel.
# R2 (lane S0l): `learn` also turns on `enth-learn` (the block AST and the lesson types the Learn view draws, lane LUI).
learn = ["dep:enth-learn"]
recreate = []
# R3 (lane S0s): the Create view (`editor/create/`, lane PUI): the header's Create hook, the drop zone, the folder
# browser and the candidate tiles. It reads `enth-session`'s create read model (lane SK3), which always compiles, so it
# adds no dependency of its own. Off by default until lane PUI (F2s) decides; the plugin's `create` feature forwards it.
create = []
# R4/R5 (lane S0e): the Ear view (`editor/ear/`, lane EUI): the header's Ear hook, the round types, the workout, the
# replay with the answer, thresholds per skill and the practised-days calendar. It reads `enth-session`'s ear read model
# (lane SE), which always compiles; `enth-music` supplies the labels (intervals, chords, bands) and `enth-learn` the
# progress file's `drills` field. Off by default until lane EUI (F2e) decides; the plugin's `ear` feature forwards it.
ear = ["dep:enth-music", "dep:enth-learn"]
# R5 (lane S0e): the duel card (`editor/duel/`, lanes SKD then DUI): the share line, the paste box, verification, the
# sealed answer and the local duel history. It reads `enth-challenge`'s result codes and `verify` and `enth-session`'s
# duel read model (lane SE), which always compile, so it adds no dependency of its own. Off by default until lane DUI
# decides; the plugin's `duel` feature forwards it.
duel = []
# R1/S1 header hook points (lane S0r): each feature turns on its no-op hook in the header (regions/header.rs) until its
# lane fills it: `recreate` (lane RUI, editor/recreate/), `presets` (lane PBU, editor/browser.rs), `add-module` (lane AM,
# editor/add_module.rs). The lanes decide whether a feature stays, becomes a default, or goes.
presets = []
# Lane AM: the header's "+ Add" menu. On by default, since S1 ships adding and removing modules (the cards' "…" menus,
# the region menus and the "+ Add" slots are always built); `default-features = false` drops the header button only.
add-module = []
# Lane PBU: the header's ◀ name ▶ / Browse / Save, on by default since S1 ships the preset browser (the browser's code
# is always built; `default-features = false` drops the header hook, and so the way to open it).
# Lane SKR (F2r): `recreate` on by default. Its header hook draws nothing until a shell hands the editor a round view
# (`Editor::set_round`), so kittest and dev-window frames that never do are unchanged; the plugin does every frame.
default = ["add-module", "presets", "recreate"]

[dependencies]
# No `default_fonts`: Theme::apply installs Inter and nothing else (assets/fonts).
egui = { workspace = true, features = ["serde"] }
serde.workspace = true
# Pre-declared by lane S0b (P1b) so Cargo.lock is resolved before the lanes fan out; lanes use what they need.
# The editor (src/editor/) builds its cards from the catalogue and edits through the session (docs/architecture.md: L7 may use L6).
enth-params.workspace = true
enth-patch.workspace = true
enth-session.workspace = true
# Layouts are JSON (`ENTH_LAYOUT`, the built-in files under src/editor/layout/), and their size tokens resolve through the
# theme's serde form. Already in Cargo.lock as a dev-dependency, so moving it here changes no lock entry.
serde_json.workspace = true
# Pre-declared by lane S0r (R1/S1): the Recreate views read Challenge and ScoreReport types (lane RUI).
enth-challenge.workspace = true
# Pre-declared by lane S0l (R2): the Learn view reads the lesson types and the markdown AST (lane LUI); optional, behind `learn`.
enth-learn = { workspace = true, optional = true }
# Pre-declared by lane S0e (R4): the Ear view's labels and the question types it draws (lane EUI); optional, behind `ear`.
enth-music = { workspace = true, optional = true }
# glow (OpenGL), not wgpu (ADR-0002); X11 only, like the target machine; the clipboard for text fields.
eframe = { workspace = true, features = ["glow", "x11", "clipboard"], optional = true }

[dev-dependencies]
# Snapshot tests render through wgpu on a CPU adapter only (Mesa lavapipe); see tests/common.
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
egui-wgpu.workspace = true
# Lane LUI: the Learn view's tests play lessons of the `basics` pack from its authoring layout (`content/lessons/basics`,
# TOML), as `cargo xtask pack` builds it. Already in Cargo.lock (with `toml`), so this changes no lock entry.
enth-learn = { workspace = true, features = ["toml"] }

[[example]]
# The editor against a real session and engine, with no audio output (docs/editor.md). Xvfb or the owner's display only.
name = "dev_window"
required-features = ["dev-window"]

[lints]
workspace = true
